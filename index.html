<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元宵吃湯圓挑戰 - LAN Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="圖片/標籤頭像.png">
    <style>
        :root {
            --bg: #2c0707;
            --card-bg: rgba(61, 10, 10, 0.95);
            --accent: #ffd966;
            --text: #ffffff;
            --bowl-border: #e63946;
        }

        body {
            background-color: var(--bg);
            background: radial-gradient(circle at center, #4a0e0e 0%, #1a0505 100%);
            color: var(--text);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 天燈背景動畫 */
        .lantern {
            position: absolute;
            bottom: -100px;
            background: #e63946;
            width: 30px;
            height: 40px;
            border-radius: 8px;
            animation: rise linear infinite;
            opacity: 0.4;
            z-index: 0;
        }
        @keyframes rise {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.5; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }

        /* 門戶卡片 */
        .portal-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }

        h1 { color: var(--accent); font-size: 1.8rem; margin-top: 0; }

        /* 遊戲大碗 */
        .bowl {
            width: 280px;
            height: 280px;
            border: 8px solid var(--bowl-border);
            border-radius: 50%;
            margin: 15px auto;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 湯圓樣式與懸停放大 */
        .ball {
            font-size: 40px;
            position: absolute;
            cursor: pointer;
            user-select: none;
            /* 加入平滑過渡 */
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }
        
        /* 滑鼠碰到時放大 */
        .ball:hover {
            transform: scale(1.3);
            z-index: 20; /* 確保放大的湯圓在最上層 */
        }

        .ball:active {
            transform: scale(0.9); /* 點擊時輕微縮小反饋 */
        }

        .info-panel {
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .target-display {
            font-size: 1.2rem;
            background: rgba(255,217,102,0.2);
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            border: none;
        }
        .btn-main { background: var(--accent); color: #4a0e0e; margin-bottom: 10px; }
        .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        #game-screen, #result-screen { display: none; }
    </style>
</head>
<body>

    <script>
        // 生成天燈
        for (let i = 0; i < 12; i++) {
            let l = document.createElement('div');
            l.className = 'lantern';
            l.style.left = Math.random() * 100 + 'vw';
            l.style.animationDuration = (Math.random() * 5 + 10) + 's';
            l.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(l);
        }
    </script>

    <div class="portal-card">
        <div id="start-screen">
            <h1>🏮 元宵大挑戰</h1>
            <p id="geo-status">正在偵測位置...</p>
            <p style="color: #ccc; font-size: 0.9rem;">在 60 秒內吃掉正確顏色的湯圓！<br>點對 +1 分，點錯 -2 分</p>
            <button class="btn btn-main" onclick="initGame()">開始吃湯圓</button>
            <br>
            <a href="home.html" class="btn btn-outline" style="font-size: 0.8rem;">直接進入首頁</a>
        </div>

        <div id="game-screen">
            <div class="target-display" id="target-msg">載入中...</div>
            <div class="info-panel">
                <span>分數: <b id="score-val">0</b></span>
                <span>剩餘: <b id="time-val">60</b>s</span>
            </div>
            <div class="bowl" id="bowl"></div>
            <button class="btn btn-outline" style="width: 100%;" onclick="generateBalls()">換一鍋湯圓</button>
        </div>

        <div id="result-screen">
            <h1>遊戲結束！</h1>
            <p style="font-size: 1.5rem;">最終得分: <span id="final-score" style="color: var(--accent);">0</span></p>
            <div class="button-group">
                <button class="btn btn-main" onclick="location.href='home.html'">進入 LAN Studio</button>
                <button class="btn btn-outline" onclick="location.reload()">重新挑戰</button>
            </div>
        </div>
    </div>

    <script>
        const colors = ['⚪', '🔴', '🟡', '🟢', '⚫'];
        const colorNames = ['白', '紅', '黃', '綠', '黑'];
        let targetIndex = 0;
        let score = 0;
        let timeLeft = 60;
        let gameTimer, colorTimer;

        async function detectLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (!['TW', 'HK', 'MO'].includes(data.country_code)) {
                    window.location.replace("/en/home.html");
                } else {
                    document.getElementById('geo-status').innerText = `偵測到：${data.country_name}，祝您元宵快樂！`;
                }
            } catch (e) {
                document.getElementById('geo-status').innerText = "準備好大快朵頤了嗎？";
            }
        }

        function initGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            startTimers();
            updateTarget();
            generateBalls();
        }

        function startTimers() {
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('time-val').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
            colorTimer = setInterval(updateTarget, 3000);
        }

        function updateTarget() {
            targetIndex = Math.floor(Math.random() * colors.length);
            document.getElementById('target-msg').innerHTML = `請吃 <span style="color:var(--accent)">${colorNames[targetIndex]}色</span> 湯圓！ ${colors[targetIndex]}`;
        }

        function generateBalls() {
            const bowl = document.getElementById('bowl');
            bowl.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const b = document.createElement('span');
                const cIdx = Math.floor(Math.random() * colors.length);
                b.innerText = colors[cIdx];
                b.className = 'ball';
                // 碗內隨機定位
                b.style.left = (15 + Math.random() * 60) + '%';
                b.style.top = (15 + Math.random() * 60) + '%';
                b.onclick = () => checkBall(cIdx);
                bowl.appendChild(b);
            }
        }

        function checkBall(clickedIdx) {
            if (clickedIdx === targetIndex) {
                score += 1;
            } else {
                score -= 2;
            }
            document.getElementById('score-val').innerText = score;
            generateBalls(); 
        }

        function endGame() {
            clearInterval(gameTimer);
            clearInterval(colorTimer);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = score;
        }

        detectLocation();
    </script>
</body>
</html>
