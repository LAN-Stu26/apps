<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎來到 LAN Studio !</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="圖片/標籤頭像.png">
    <style>
        :root {
            --bg: #1d1d1d;
            --card-bg: #252526;
            --accent: #ffd966;
            --text: #ffffff;
            --overlay: rgba(0, 0, 0, 0.85);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 核心卡片容器 */
        .portal-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 217, 102, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 380px;
            width: 90%;
            animation: cardRise 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            position: relative;
            z-index: 10;
        }

        .portal-card > * {
            animation: contentFadeUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 4px;
            animation-delay: 0.3s;
        }

        .status-msg {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 30px;
            animation-delay: 0.4s;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation-delay: 0.5s;
        }

        /* 按鈕樣式 */
        .btn {
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: block;
            border: none;
            outline: none;
        }

        .btn-main { background: var(--accent); color: #000; }
        .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        .btn-grey { background: #444; color: #fff; }
        
        .btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(255, 217, 102, 0.3); }

        .auto-redirect-tip {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #555;
            animation-delay: 0.7s;
        }

        #target-lang { color: var(--accent); font-weight: bold; }

        /* 自定義彈窗樣式 */
        #custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay);
            backdrop-filter: blur(8px);
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            text-align: center;
            max-width: 320px;
            width: 85%;
        }

        .modal-title {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .modal-desc {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .modal-btns .btn {
            flex: 1;
            padding: 12px;
            font-size: 0.9rem;
        }

        /* 動畫定義 */
        @keyframes cardRise {
            0% { transform: translateY(100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes contentFadeUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="welcome-title">LAN Studio</div>
        <div id="geo-status" class="status-msg">正在優化您的瀏覽體驗...</div>
        
        <div class="button-group">
            <button class="btn btn-main" onclick="handleLangClick('home.html')">繁體中文服務 (Traditional Chinese)</button>
            <button class="btn btn-outline" onclick="handleLangClick('/en/home.html')">English Services</button>
        </div>

        <div class="auto-redirect-tip">
            <span id="target-lang">偵測中...</span> 將於 <span id="countdown">5</span> 秒後自動跳轉
        </div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div class="modal-title">偏好設定 / Preference</div>
            <div class="modal-desc">
                是否要記住此選擇？<br>下次將直接進入該版本。<br>
                <small style="font-size: 0.7rem; color: #777;">Would you like to save this as your default language?</small>
            </div>
            <div class="modal-btns">
                <button class="btn btn-main" onclick="confirmSave(true)">要，記住</button>
                <button class="btn btn-grey" onclick="confirmSave(false)">不需要</button>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        let redirectUrl = "home.html";
        let langName = "繁體中文";
        let timer;
        let pendingUrl = ""; // 暫存使用者點選的網址
        const STORAGE_KEY = 'lan_studio_lang_pref';

        function stopTimer() { 
            clearInterval(timer); 
            document.querySelector('.auto-redirect-tip').style.display = 'none';
        }

        // 點擊語言按鈕
        function handleLangClick(url) {
            stopTimer();
            pendingUrl = url;
            const modal = document.getElementById('custom-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
        }

        // 彈窗按下後的處理
        function confirmSave(shouldSave) {
            if (shouldSave) {
                localStorage.setItem(STORAGE_KEY, pendingUrl);
            }
            window.location.href = pendingUrl;
        }

        async function init() {
            // 檢查是否帶有 #rechoose 強制重選
            if (window.location.hash === '#rechoose') {
                localStorage.removeItem(STORAGE_KEY);
                document.getElementById('geo-status').innerText = "已重置偏好，請重新選擇";
                history.replaceState(null, null, ' '); // 移除網址上的 #rechoose
                startDetection();
                return;
            }

            // 檢查是否有預設紀錄
            const savedLang = localStorage.getItem(STORAGE_KEY);
            if (savedLang) {
                document.getElementById('geo-status').innerText = "套用偏好設定中...";
                window.location.replace(savedLang);
                return;
            }

            startDetection();
        }

        async function startDetection() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                if (['TW', 'HK', 'MO'].includes(data.country_code)) {
                    redirectUrl = "home.html";
                    langName = "繁體中文頁面";
                } else {
                    redirectUrl = "/en/home.html";
                    langName = "English Page";
                }
                
                document.getElementById('geo-status').innerText = `偵測區域：${data.country_name || data.country_code}`;
            } catch (error) {
                document.getElementById('geo-status').innerText = "系統就緒，準備進入";
            } finally {
                document.getElementById('target-lang').innerText = langName;
                startCountdown();
            }
        }

        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            timer = setInterval(() => {
                timeLeft--;
                if (countdownEl) countdownEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    window.location.replace(redirectUrl);
                }
            }, 1000);
        }

        init();
    </script>
</body>
</html>
