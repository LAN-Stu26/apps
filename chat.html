<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lan Chat - LAN Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --default-yellow: #ffd966;
            --primary-dark: #ffd966;
            --bg-color: #1d1d1d;
            --secondary-dark: #2a2a2a;
            --message-bg: #333;
        }

        /* 移除預設邊距並確保高度填滿 */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        /* 隱藏 navbar.js 自動生成的頁尾 */
        #custom-footer, footer { display: none !important; }

        /* 聊天主要佈局 - 讓它填滿 navbar 以下的所有空間 */
        .chat-layout {
            display: flex;
            height: 100%; /* navbar.js 會處理 body 的 padding-top */
            position: relative;
            background-color: var(--bg-color);
        }

        /* 載入中遮罩 */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }

        /* 側邊欄 */
        .sidebar {
            width: 300px;
            background-color: var(--secondary-dark);
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-header button {
            background: var(--primary-dark);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .room-list { flex: 1; overflow-y: auto; }

        .room-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            transition: 0.2s;
        }

        .room-item:hover, .room-item.active {
            background-color: #333;
            border-left: 4px solid var(--primary-dark);
        }

        .room-item h4 { font-size: 0.9rem; color: var(--primary-dark); margin-bottom: 5px; }
        .room-item p { font-size: 0.7rem; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 主聊天視窗 */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
        }

        .chat-header {
            padding: 15px 25px;
            background: var(--secondary-dark);
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 訊息氣泡 */
        .message { max-width: 80%; display: flex; flex-direction: column; }
        .message.sent { align-self: flex-end; align-items: flex-end; }
        .message.received { align-self: flex-start; }
        .message-info { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        .message-bubble {
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-all;
        }
        .sent .message-bubble { background-color: var(--primary-dark); color: var(--bg-color); }
        .received .message-bubble { background-color: var(--message-bg); color: white; }

        /* 輸入框 */
        .input-area { padding: 20px; background: var(--secondary-dark); display: flex; gap: 10px; }
        .input-area input {
            flex: 1; background: #111; border: 1px solid #444;
            padding: 12px 20px; border-radius: 25px; color: white; outline: none;
        }
        .input-area button {
            background: var(--primary-dark); border: none; width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* 彈窗 */
        .modal {
            display: none; position: fixed; z-index: 999999;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--secondary-dark); margin: 15% auto; padding: 25px;
            width: 90%; max-width: 400px; border-radius: 15px; border: 1px solid #444; text-align: center;
        }
        .modal-content input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #1d1d1d; border: 1px solid #444; color: white; border-radius: 8px;
        }
        .modal-content button {
            background: var(--primary-dark); color: var(--bg-color); border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;
        }

        /* 手機 UI 設計 */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute; left: 0; top: 0; bottom: 0;
                transform: translateX(-100%);
            }
            .sidebar.mobile-active { transform: translateX(0); }
            #current-room-title { cursor: pointer; display: flex; align-items: center; gap: 8px; }
            #current-room-title::before { content: '☰'; color: var(--primary-dark); font-size: 1.2rem; }
            
            .sidebar-overlay {
                display: none; position: absolute; inset: 0;
                background: rgba(0,0,0,0.5); z-index: 999;
            }
            .sidebar-overlay.active { display: block; }
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner {
            width: 30px; height: 30px; border: 3px solid #333;
            border-top-color: var(--primary-dark); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div style="text-align: center;">
            <div class="spinner"></div>
            <p id="loading-text">載入中，請稍候...</p>
        </div>
    </div>

    <div class="chat-layout">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileSidebar()"></div>
        
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button onclick="checkAuthAndShow('createModal')">＋ 建立房間</button>
                <button onclick="showModal('joinModal')" style="background: #444; color: white;">＃ 加入 ID</button>
            </div>
            <div class="room-list" id="room-list">
                <div class="room-item active" onclick="switchRoom('public', '公共聊天室')">
                    <h4>公共聊天室</h4>
                    <p>全站使用者通用聊天室</p>
                </div>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <h3 id="current-room-title" onclick="toggleMobileSidebar()">公共聊天室</h3>
                <span id="current-room-id" style="font-size: 0.7rem; color: #666; cursor: pointer;" title="點擊複製 ID">ID: public</span>
            </div>
            
            <div class="messages-container" id="messages-container"></div>

            <form class="input-area" id="chat-form">
                <input type="text" id="msg-input" placeholder="輸入訊息..." autocomplete="off">
                <button type="submit">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 1 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--primary-dark)">建立私密聊天室</h3>
            <input type="text" id="new-room-name" placeholder="聊天室名稱...">
            <input type="text" id="new-room-id" placeholder="自訂 ID (6-30字，英數)...">
            <button onclick="handleCreateRoom()">確認建立</button>
            <p onclick="closeModal('createModal')" style="margin-top: 15px; cursor: pointer; color: #888;">取消</p>
        </div>
    </div>

    <div id="joinModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--primary-dark)">加入聊天室</h3>
            <input type="text" id="join-room-id" placeholder="輸入房間 ID...">
            <button onclick="handleJoinRoom()">加入房間</button>
            <p onclick="closeModal('joinModal')" style="margin-top: 15px; cursor: pointer; color: #888;">取消</p>
        </div>
    </div>

    <script type="module">
        import { auth, app } from "/navbar.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const db = getFirestore(app);
        let currentRoomId = 'public';
        let currentUser = null;
        let unsubscribeMessages = null;

        // 持久化儲存：使用者加入過的房間
        let myRooms = JSON.parse(localStorage.getItem('lan_chat_rooms') || '[]');

        // 監聽登入
        auth.onAuthStateChanged(user => {
            currentUser = user;
            document.getElementById('loading-overlay').style.display = 'none';
            initRoomList();
            loadMessages(currentRoomId);
        });

        // 初始化房間列表
        function initRoomList() {
            const list = document.getElementById('room-list');
            list.innerHTML = `
                <div class="room-item ${currentRoomId === 'public' ? 'active' : ''}" onclick="switchRoom('public', '公共聊天室')">
                    <h4>公共聊天室</h4>
                    <p>全站使用者通用聊天室</p>
                </div>
            `;
            myRooms.forEach(room => addRoomToSidebarUI(room.id, room.name));
        }

        window.switchRoom = (roomId, roomName) => {
            currentRoomId = roomId;
            document.getElementById('current-room-title').innerText = roomName;
            document.getElementById('current-room-id').innerText = `ID: ${roomId}`;
            
            document.querySelectorAll('.room-item').forEach(el => {
                el.classList.remove('active');
                if(el.querySelector('h4').innerText === roomName) el.classList.add('active');
            });

            // 手機版自動收合
            if(window.innerWidth <= 768) toggleMobileSidebar();

            loadMessages(roomId);
        };

        function loadMessages(roomId) {
            if (unsubscribeMessages) unsubscribeMessages();
            const container = document.getElementById('messages-container');
            container.innerHTML = '<p style="text-align:center; color:#555;">載入中...</p>';
            
            const q = query(collection(db, "chat_rooms", roomId, "messages"), orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = currentUser && data.uid === currentUser.uid;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
                    msgDiv.innerHTML = `
                        <div class="message-info">${data.userName || '匿名'} • ${data.timestamp?.toDate().toLocaleTimeString() || '傳送中'}</div>
                        <div class="message-bubble">${data.text}</div>
                    `;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            if (!currentUser) return alert('請先登入');

            const userName = currentUser.displayName || '使用者';
            input.value = '';
            await addDoc(collection(db, "chat_rooms", currentRoomId, "messages"), {
                text,
                uid: currentUser.uid,
                userName,
                timestamp: serverTimestamp()
            });
        };

        window.checkAuthAndShow = (modalId) => {
            if (!currentUser) return alert('請先登入才能建立房間');
            showModal(modalId);
        };

        window.handleCreateRoom = async () => {
            const name = document.getElementById('new-room-name').value.trim();
            const id = document.getElementById('new-room-id').value.trim();
            
            if (!name || id.length < 6 || id.length > 30) {
                return alert('請確認名稱，且 ID 需為 6-30 個字');
            }

            const roomRef = doc(db, "chat_rooms", id);
            const snap = await getDoc(roomRef);
            if (snap.exists()) return alert('此 ID 已被使用，請更換');

            await setDoc(roomRef, {
                name: name,
                createdBy: currentUser.uid,
                createdAt: serverTimestamp()
            });

            saveAndJoin(id, name);
            closeModal('createModal');
        };

        window.handleJoinRoom = async () => {
            const id = document.getElementById('join-room-id').value.trim();
            if (!id) return;
            
            const snap = await getDoc(doc(db, "chat_rooms", id));
            if (snap.exists()) {
                saveAndJoin(id, snap.data().name);
                closeModal('joinModal');
            } else {
                alert('找不到該聊天室');
            }
        };

        function saveAndJoin(id, name) {
            if (!myRooms.find(r => r.id === id)) {
                myRooms.push({ id, name });
                localStorage.setItem('lan_chat_rooms', JSON.stringify(myRooms));
                addRoomToSidebarUI(id, name);
            }
            switchRoom(id, name);
        }

        function addRoomToSidebarUI(id, name) {
            const list = document.getElementById('room-list');
            const div = document.createElement('div');
            div.className = 'room-item';
            div.onclick = () => switchRoom(id, name);
            div.innerHTML = `<h4>${name}</h4><p>ID: ${id}</p>`;
            list.appendChild(div);
        }

        window.toggleMobileSidebar = () => {
            document.getElementById('sidebar').classList.toggle('mobile-active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        };

        window.showModal = (id) => document.getElementById(id).style.display = 'block';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        document.getElementById('current-room-id').onclick = function() {
            const id = this.innerText.replace('ID: ', '');
            navigator.clipboard.writeText(id);
            alert('ID 已複製');
        };
    </script>
</body>
</html>
