<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lan Chat - LAN Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --default-yellow: #ffd966;
            --primary-dark: #ffd966;
            --bg-color: #1d1d1d;
            --secondary-dark: #2a2a2a;
            --message-bg: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 關鍵：強制刪除 navbar.js 自動產生的 padding-top 間隔 */
        body > .chat-layout { 
            padding-top: 0 !important; 
            margin-top: 0 !important;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 佈局容器：確保扣除導覽列高度 */
        .chat-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px); 
            position: relative;
        }

        /* 載入中提示 */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 側邊欄 */
        .sidebar {
            width: 300px;
            background-color: var(--secondary-dark);
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-header button {
            background: var(--primary-dark);
            color: var(--bg-color);
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .room-list { flex: 1; overflow-y: auto; }

        .room-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            transition: 0.2s;
        }

        .room-item:hover, .room-item.active {
            background-color: #333;
            border-left: 4px solid var(--primary-dark);
        }

        .room-item h4 { font-size: 0.9rem; color: var(--primary-dark); }
        .room-item p { font-size: 0.7rem; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 主聊天視窗 */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
        }

        .chat-header {
            padding: 15px 25px;
            background: var(--secondary-dark);
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 訊息氣泡 */
        .message { max-width: 75%; display: flex; flex-direction: column; }
        .message.sent { align-self: flex-end; align-items: flex-end; }
        .message.received { align-self: flex-start; }
        .message-info { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        .message-bubble {
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-all;
        }
        .sent .message-bubble { background-color: var(--primary-dark); color: var(--bg-color); }
        .received .message-bubble { background-color: var(--message-bg); color: white; }

        /* 輸入框 */
        .input-area {
            padding: 20px;
            background: var(--secondary-dark);
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1; background: #111; border: 1px solid #444;
            padding: 12px 20px; border-radius: 25px; color: white; outline: none;
        }

        .input-area button {
            background: var(--primary-dark); border: none;
            width: 45px; height: 45px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* 彈窗 */
        .modal {
            display: none; position: fixed; z-index: 100000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--secondary-dark); margin: 15% auto;
            padding: 25px; width: 90%; max-width: 400px;
            border-radius: 15px; border: 1px solid #444; text-align: center;
        }

        .modal-content input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #1d1d1d; border: 1px solid #444; color: white; border-radius: 8px;
        }

        .modal-content button {
            background: var(--primary-dark); color: var(--bg-color);
            border: none; padding: 12px; border-radius: 8px;
            font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;
        }

        /* 手機 UI 設計 */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                z-index: 1000;
                transform: translateX(-100%);
            }
            .sidebar.active { transform: translateX(0); }
            #current-room-title::before {
                content: '☰ ';
                color: var(--primary-dark);
                cursor: pointer;
            }
        }

        /* 隱藏頁尾在聊天室顯示 (可選，避免遮擋輸入) */
        #custom-footer { display: none !important; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div style="border: 4px solid #333; border-top: 4px solid var(--primary-dark); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 15px; color: var(--primary-dark);">載入聊天室中...</p>
    </div>

    <div class="chat-layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button onclick="checkAuthAndShow('createModal')">＋ 建立房間</button>
                <button onclick="checkAuthAndShow('joinModal')" style="background: #444; color: white;">＃ 加入 ID</button>
            </div>
            <div class="room-list" id="room-list">
                <div class="room-item active" data-id="public" onclick="switchRoom('public', '公共聊天室')">
                    <h4>公共聊天室</h4>
                    <p>全站使用者通用聊天室</p>
                </div>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <h3 id="current-room-title" onclick="toggleMobileSidebar()">公共聊天室</h3>
                <span id="current-room-id" style="font-size: 0.7rem; color: #666; cursor: pointer;">ID: public</span>
            </div>
            
            <div class="messages-container" id="messages-container"></div>

            <form class="input-area" id="chat-form">
                <input type="text" id="msg-input" placeholder="輸入訊息..." autocomplete="off">
                <button type="submit">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 1 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--primary-dark)">建立私密聊天室</h3>
            <input type="text" id="new-room-name" placeholder="聊天室顯示名稱...">
            <input type="text" id="new-room-id" placeholder="自訂 ID (6-30字元)...">
            <button onclick="handleCreateRoom()">確認建立</button>
            <p onclick="closeModal('createModal')" style="margin-top: 15px; cursor: pointer; color: #888;">取消</p>
        </div>
    </div>

    <div id="joinModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--primary-dark)">加入聊天室</h3>
            <input type="text" id="join-room-id" placeholder="輸入房間 ID...">
            <button onclick="handleJoinRoom()">加入房間</button>
            <p onclick="closeModal('joinModal')" style="margin-top: 15px; cursor: pointer; color: #888;">取消</p>
        </div>
    </div>

    <script type="module">
        import { auth, app } from "/navbar.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const db = getFirestore(app);
        let currentRoomId = 'public';
        let currentUser = null;
        let unsubscribeMessages = null;

        // 從 LocalStorage 獲取使用者曾經加入過的房間
        let myRooms = JSON.parse(localStorage.getItem('lan_chat_joined_rooms') || '[]');

        // 監聽登入狀態
        auth.onAuthStateChanged(user => {
            currentUser = user;
            document.getElementById('loading-screen').style.display = 'none';
            refreshRoomSidebar();
            loadMessages(currentRoomId);
        });

        // 確保 navbar 間隔被刪除 (二次確保)
        const fixLayout = () => {
            const layout = document.querySelector('.chat-layout');
            if(layout) layout.style.paddingTop = '0px';
        };
        setInterval(fixLayout, 500);

        // UI: 手機選單切換
        window.toggleMobileSidebar = () => {
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.toggle('active');
            }
        };

        // UI: 權限檢查
        window.checkAuthAndShow = (modalId) => {
            if(!currentUser) return alert("請先登入後再執行此操作");
            showModal(modalId);
        };

        // 切換房間
        window.switchRoom = (roomId, roomName) => {
            currentRoomId = roomId;
            document.getElementById('current-room-title').innerText = roomName;
            document.getElementById('current-room-id').innerText = `ID: ${roomId}`;
            
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            const target = document.querySelector(`.room-item[data-id="${roomId}"]`);
            if(target) target.classList.add('active');

            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('active');
            loadMessages(roomId);
        };

        // 載入訊息
        function loadMessages(roomId) {
            if (unsubscribeMessages) unsubscribeMessages();
            const container = document.getElementById('messages-container');
            container.innerHTML = '<p style="text-align:center; color:#555;">載入中...</p>';
            
            const q = query(collection(db, "chat_rooms", roomId, "messages"), orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = currentUser && data.uid === currentUser.uid;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
                    msgDiv.innerHTML = `
                        <div class="message-info">${data.userName || '匿名'} • ${data.timestamp?.toDate().toLocaleTimeString() || '傳送中...'}</div>
                        <div class="message-bubble">${data.text}</div>
                    `;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        // 傳送訊息
        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            if (!currentUser) return alert("請登入後再發送訊息");

            const userName = currentUser.displayName || '使用者';
            input.value = '';
            await addDoc(collection(db, "chat_rooms", currentRoomId, "messages"), {
                text,
                uid: currentUser.uid,
                userName,
                timestamp: serverTimestamp()
            });
        };

        // 建立房間
        window.handleCreateRoom = async () => {
            const name = document.getElementById('new-room-name').value.trim();
            const id = document.getElementById('new-room-id').value.trim();
            
            if (!name || !id) return alert('請填寫完整資訊');
            if (id.length < 6 || id.length > 30) return alert('ID 長度需為 6-30 字元');

            const roomRef = doc(db, "chat_rooms", id);
            const snap = await getDoc(roomRef);
            if(snap.exists()) return alert('此 ID 已被使用，請換一個');

            await setDoc(roomRef, {
                name: name,
                createdBy: currentUser.uid,
                createdAt: serverTimestamp()
            });

            saveAndAddRoom(id, name);
            closeModal('createModal');
            switchRoom(id, name);
        };

        // 加入房間
        window.handleJoinRoom = async () => {
            const id = document.getElementById('join-room-id').value.trim();
            if (!id) return;
            
            const roomSnap = await getDoc(doc(db, "chat_rooms", id));
            if (roomSnap.exists()) {
                saveAndAddRoom(id, roomSnap.data().name);
                closeModal('joinModal');
                switchRoom(id, roomSnap.data().name);
            } else {
                alert('找不到該聊天室 ID');
            }
        };

        function saveAndAddRoom(id, name) {
            if(!myRooms.find(r => r.id === id)) {
                myRooms.push({id, name});
                localStorage.setItem('lan_chat_joined_rooms', JSON.stringify(myRooms));
                refreshRoomSidebar();
            }
        }

        function refreshRoomSidebar() {
            const list = document.getElementById('room-list');
            list.innerHTML = `
                <div class="room-item ${currentRoomId === 'public' ? 'active' : ''}" data-id="public" onclick="switchRoom('public', '公共聊天室')">
                    <h4>公共聊天室</h4>
                    <p>全站使用者通用聊天室</p>
                </div>
            `;
            myRooms.forEach(room => {
                const div = document.createElement('div');
                div.className = `room-item ${currentRoomId === room.id ? 'active' : ''}`;
                div.setAttribute('data-id', room.id);
                div.onclick = () => switchRoom(room.id, room.name);
                div.innerHTML = `<h4>${room.name}</h4><p>ID: ${room.id}</p>`;
                list.appendChild(div);
            });
        }

        window.showModal = (id) => document.getElementById(id).style.display = 'block';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        document.getElementById('current-room-id').onclick = function() {
            const id = this.innerText.replace('ID: ', '');
            navigator.clipboard.writeText(id);
            alert('ID 已複製到剪貼簿');
        };
    </script>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
</body>
</html>
