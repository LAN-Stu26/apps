<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lan Chat - LAN Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --default-yellow: #ffd966;
            --primary-dark: #ffd966;
            --bg-color: #1d1d1d;
            --secondary-dark: #2a2a2a;
            --message-bg: #333;
            --navbar-height: 60px; /* 預留 navbar 高度 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 移除 navbar 與內容間的間隙 */
        #navbar-placeholder {
            height: var(--navbar-height);
            flex-shrink: 0;
        }

        .chat-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - var(--navbar-height));
            overflow: hidden;
            position: relative;
        }

        /* 側邊欄設計 */
        .sidebar {
            width: 300px;
            background-color: var(--secondary-dark);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-header button {
            background: var(--primary-dark);
            color: var(--bg-color);
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
        }

        .room-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        .room-item:hover, .room-item.active {
            background-color: #383838;
            border-left: 4px solid var(--primary-dark);
        }

        .room-item h4 { font-size: 0.9rem; color: var(--primary-dark); margin-bottom: 4px; }
        .room-item p { font-size: 0.7rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 主聊天視窗 */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            position: relative;
        }

        .chat-header {
            padding: 12px 20px;
            background: var(--secondary-dark);
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 手機版選單切換按鈕 */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--primary-dark);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message { max-width: 85%; display: flex; flex-direction: column; }
        .message.sent { align-self: flex-end; align-items: flex-end; }
        .message.received { align-self: flex-start; }
        .message-info { font-size: 0.7rem; color: #777; margin: 0 5px 4px 5px; }
        .message-bubble {
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
        }
        .sent .message-bubble { background-color: var(--primary-dark); color: #000; border-bottom-right-radius: 2px; }
        .received .message-bubble { background-color: #333; color: white; border-bottom-left-radius: 2px; }

        /* 輸入區 */
        .input-area {
            padding: 15px;
            background: var(--secondary-dark);
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }

        .input-area input {
            flex: 1;
            background: #111;
            border: 1px solid #444;
            padding: 10px 18px;
            border-radius: 20px;
            color: white;
            outline: none;
        }

        .input-area button {
            background: var(--primary-dark);
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* 載入與提示 */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(29,29,29,0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 50;
        }

        /* 彈窗 */
        .modal {
            display: none;
            position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--secondary-dark);
            margin: 15vh auto; padding: 25px;
            width: 90%; max-width: 400px;
            border-radius: 12px; border: 1px solid #444;
        }

        .modal-content input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #111; border: 1px solid #444; color: white; border-radius: 6px;
        }

        .modal-content button {
            width: 100%; padding: 12px; margin-top: 10px;
            background: var(--primary-dark); border: none; font-weight: bold; border-radius: 6px; cursor: pointer;
        }

        /* 手機版適配 */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                transform: translateX(-100%);
                height: 100%;
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="chat-layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="btn-show-create" onclick="showModal('createModal')">＋ 建立聊天室</button>
                <button onclick="showModal('joinModal')" style="background: #444; color: white;">＃ 加入聊天室</button>
            </div>
            <div class="room-list" id="room-list">
                <div class="room-item active" onclick="switchRoom('public', '公共聊天室')">
                    <h4>公共聊天室</h4>
                    <p>ID: public</p>
                </div>
            </div>
        </div>

        <div class="main-chat">
            <div id="loading-overlay">載入中...</div>
            
            <div class="chat-header">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <div>
                    <h3 id="current-room-title">公共聊天室</h3>
                    <p id="current-room-id" style="font-size: 0.7rem; color: #666;">ID: public</p>
                </div>
            </div>
            
            <div class="messages-container" id="messages-container"></div>

            <form class="input-area" id="chat-form">
                <input type="text" id="msg-input" placeholder="說點什麼..." autocomplete="off">
                <button type="submit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </form>
        </div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--primary-dark); margin-bottom: 10px;">建立聊天室</h3>
            <p style="font-size: 0.8rem; color: #888;">名稱</p>
            <input type="text" id="new-room-name" placeholder="例如：技術討論區">
            <p style="font-size: 0.8rem; color: #888;">自訂 ID (6-30 字，僅限英數)</p>
            <input type="text" id="new-room-id" placeholder="例如：myroom123" maxlength="30">
            <button onclick="handleCreateRoom()">確認建立</button>
            <button onclick="closeModal('createModal')" style="background:#222; color:#888;">取消</button>
        </div>
    </div>

    <div id="joinModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--primary-dark); margin-bottom: 10px;">加入聊天室</h3>
            <input type="text" id="join-room-id" placeholder="輸入房間 ID">
            <button onclick="handleJoinRoom()">加入</button>
            <button onclick="closeModal('joinModal')" style="background:#222; color:#888;">取消</button>
        </div>
    </div>

    <script type="module">
        import { auth, db, app } from "/navbar.js";
        import { collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let currentRoomId = 'public';
        let currentUser = null;
        let unsubscribeMessages = null;

        // 讀取本地保存的房間
        let joinedRooms = JSON.parse(localStorage.getItem('chat_joined_rooms') || '[]');

        // 監聽登入狀態
        auth.onAuthStateChanged(user => {
            currentUser = user;
            document.getElementById('btn-show-create').style.display = user ? 'block' : 'none';
            loadMessages(currentRoomId);
            refreshRoomList();
        });

        // 側邊欄開關
        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('open');
        };

        // 切換房間
        window.switchRoom = async (roomId, roomName) => {
            currentRoomId = roomId;
            document.getElementById('current-room-title').innerText = roomName;
            document.getElementById('current-room-id').innerText = `ID: ${roomId}`;
            
            // 更新 UI 狀態
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            if (window.innerWidth <= 768) toggleSidebar();
            
            loadMessages(roomId);
        };

        // 載入訊息
        function loadMessages(roomId) {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex';

            if (unsubscribeMessages) unsubscribeMessages();
            
            const q = query(collection(db, "chat_rooms", roomId, "messages"), orderBy("timestamp", "asc"));
            const container = document.getElementById('messages-container');
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = currentUser && data.uid === currentUser.uid;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
                    msgDiv.innerHTML = `
                        <div class="message-info">${data.userName || 'Unknown User'}</div>
                        <div class="message-bubble">${data.text}</div>
                    `;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
                loader.style.display = 'none';
            }, (error) => {
                console.error("讀取失敗:", error);
                loader.style.display = 'none';
            });
        }

        // 傳送訊息
        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const userName = currentUser ? currentUser.displayName : 'Unknown User';
            const uid = currentUser ? currentUser.uid : 'anonymous';

            input.value = '';
            try {
                await addDoc(collection(db, "chat_rooms", currentRoomId, "messages"), {
                    text, uid, userName, timestamp: serverTimestamp()
                });
            } catch (err) {
                alert("傳送失敗，請檢查權限");
            }
        };

        // 建立房間
        window.handleCreateRoom = async () => {
            if (!currentUser) return alert('請先登入');
            
            const name = document.getElementById('new-room-name').value.trim();
            const customId = document.getElementById('new-room-id').value.trim();
            
            if (!name || customId.length < 6) return alert('名稱必填且 ID 需至少 6 位元');
            if (!/^[a-zA-Z0-9]+$/.test(customId)) return alert('ID 僅限英文字母與數字');

            const roomRef = doc(db, "chat_rooms", customId);
            const snap = await getDoc(roomRef);
            if (snap.exists()) return alert('此 ID 已被佔用，請換一個');

            await setDoc(roomRef, {
                name: name,
                createdBy: currentUser.uid,
                createdAt: serverTimestamp()
            });

            saveRoom(customId, name);
            closeModal('createModal');
            switchRoom(customId, name);
        };

        // 加入房間
        window.handleJoinRoom = async () => {
            const id = document.getElementById('join-room-id').value.trim();
            if (!id) return;
            
            const roomSnap = await getDoc(doc(db, "chat_rooms", id));
            if (roomSnap.exists()) {
                saveRoom(id, roomSnap.data().name);
                closeModal('joinModal');
                switchRoom(id, roomSnap.data().name);
            } else {
                alert('找不到該聊天室 ID');
            }
        };

        function saveRoom(id, name) {
            if (!joinedRooms.find(r => r.id === id)) {
                joinedRooms.push({id, name});
                localStorage.setItem('chat_joined_rooms', JSON.stringify(joinedRooms));
                refreshRoomList();
            }
        }

        function refreshRoomList() {
            const list = document.getElementById('room-list');
            // 保留公共聊天室
            list.innerHTML = `<div class="room-item ${currentRoomId === 'public' ? 'active' : ''}" onclick="switchRoom('public', '公共聊天室')">
                <h4>公共聊天室</h4><p>ID: public</p>
            </div>`;
            
            joinedRooms.forEach(room => {
                const div = document.createElement('div');
                div.className = `room-item ${currentRoomId === room.id ? 'active' : ''}`;
                div.onclick = () => switchRoom(room.id, room.name);
                div.innerHTML = `<h4>${room.name}</h4><p>ID: ${room.id}</p>`;
                list.appendChild(div);
            });
        }

        window.showModal = (id) => document.getElementById(id).style.display = 'block';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    </script>
</body>
</html>
