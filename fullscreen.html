<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全螢幕顏色 - LAN Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffd966;
            --bg-color: #1d1d1d;
            --card-bg: #252526;
            --text-color: #ffffff;
            --border-color: #3c3c3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding-top: 80px; /* 預留 navbar 空間 */
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: #aaa;
        }

        input[type="color"] {
            width: 100%;
            height: 50px;
            border: none;
            padding: 0;
            background: none;
            cursor: pointer;
        }
        
        input[type="range"] {
            width: 100%;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background: #f0c95a;
        }
        
        .btn-secondary {
            background: #444;
            color: white;
        }
        .btn-secondary:hover {
            background: #555;
        }

        .preset-colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border-color);
            transition: transform 0.2s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }

        #display-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 2147483647; /* 確保蓋過 navbar */
            display: none; /* 預設隱藏 */
            align-items: center;
            justify-content: center;
        }
        
        #fullscreen-hint {
            color: rgba(255,255,255,0.5);
            font-size: 1rem;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            display: none; /* 預設隱藏 */
            transition: opacity 0.5s;
        }

    </style>
</head>
<body>

    <div id="display-area">
        <span id="fullscreen-hint">按 ESC 鍵退出</span>
    </div>

    <div class="container">
        <div class="control-panel">
            <h1 class="section-title">靜態顏色設定</h1>
            <div class="grid-layout">
                <div class="input-group">
                    <label for="color-picker">自訂顏色</label>
                    <input type="color" id="color-picker" value="#ffd966">
                </div>
                <div class="input-group">
                    <label>快速預設</label>
                    <div class="preset-colors">
                        <div class="color-swatch" style="background: #e74c3c;" data-color="#e74c3c"></div>
                        <div class="color-swatch" style="background: #f1c40f;" data-color="#f1c40f"></div>
                        <div class="color-swatch" style="background: #2ecc71;" data-color="#2ecc71"></div>
                        <div class="color-swatch" style="background: #3498db;" data-color="#3498db"></div>
                        <div class="color-swatch" style="background: #9b59b6;" data-color="#9b59b6"></div>
                        <div class="color-swatch" style="background: #ffffff;" data-color="#ffffff"></div>
                        <div class="color-swatch" style="background: #000000;" data-color="#000000"></div>
                    </div>
                </div>
            </div>
            <button class="btn" id="show-static-btn">顯示靜態全螢幕顏色</button>

            <h1 class="section-title" style="margin-top: 40px;">動態彩虹模式</h1>
            <div class="grid-layout">
                <div class="input-group">
                    <label for="rainbow-speed">彩虹變換速度</label>
                    <input type="range" id="rainbow-speed" min="1" max="10" value="5">
                </div>
                <div class="input-group">
                    <label>模式選擇</label>
                    <select id="rainbow-mode" style="padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 5px;">
                        <option value="spectrum">全光譜循環 (預設)</option>
                        <option value="custom">自訂顏色序列</option>
                    </select>
                </div>
            </div>

            <div id="custom-sequence-controls" style="display:none; margin-bottom: 20px; background: #333; padding: 15px; border-radius: 8px;">
                <label style="display:block; margin-bottom:10px;">建立顏色序列 (至少加入 2 個顏色)</label>
                <div style="display:flex; gap:10px; margin-bottom:15px; align-items: center;">
                    <input type="color" id="seq-color-picker" value="#ff0000" style="width:50px; height:40px;">
                    <button class="btn" id="add-seq-color" style="width:auto; padding: 8px 20px;">加入清單</button>
                    <button class="btn btn-secondary" id="clear-seq-color" style="width:auto; padding: 8px 20px;">清空</button>
                </div>
                <div id="seq-list" class="preset-colors" style="min-height:40px; background:#222; padding:10px; border-radius:8px; border:1px solid #444;"></div>
            </div>
            <button class="btn btn-secondary" id="show-rainbow-btn">啟動動態彩虹模式</button>
        </div>
    </div>

    <script type="module" src="navbar.js"></script>
    <script>
        const displayArea = document.getElementById('display-area');
        const hint = document.getElementById('fullscreen-hint');
        const colorPicker = document.getElementById('color-picker');
        const showStaticBtn = document.getElementById('show-static-btn');
        const showRainbowBtn = document.getElementById('show-rainbow-btn');
        const rainbowSpeedSlider = document.getElementById('rainbow-speed');
        const presetSwatches = document.querySelectorAll('.color-swatch');
        
        // 新增控制項
        const rainbowModeSelect = document.getElementById('rainbow-mode');
        const customControls = document.getElementById('custom-sequence-controls');
        const seqColorPicker = document.getElementById('seq-color-picker');
        const addSeqBtn = document.getElementById('add-seq-color');
        const clearSeqBtn = document.getElementById('clear-seq-color');
        const seqList = document.getElementById('seq-list');

        let rainbowAnimationId = null;
        let customColors = [];
        let seqIndex = 0;
        let seqProgress = 0;
        let hintTimeout = null;

        // --- 自訂顏色序列邏輯 ---
        rainbowModeSelect.addEventListener('change', () => {
            if (rainbowModeSelect.value === 'custom') {
                customControls.style.display = 'block';
            } else {
                customControls.style.display = 'none';
            }
        });

        function updateSeqListUI() {
            seqList.innerHTML = '';
            customColors.forEach((color, index) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.background = color;
                swatch.title = "點擊移除";
                swatch.onclick = () => {
                    customColors.splice(index, 1);
                    updateSeqListUI();
                };
                seqList.appendChild(swatch);
            });
        }

        addSeqBtn.addEventListener('click', () => {
            customColors.push(seqColorPicker.value);
            updateSeqListUI();
        });

        clearSeqBtn.addEventListener('click', () => {
            customColors = [];
            updateSeqListUI();
        });

        // 預設加入幾個顏色方便測試
        customColors = ['#ff0000', '#00ff00', '#0000ff'];
        updateSeqListUI();


        // --- 靜態顏色 ---
        function setStaticColor(color) {
            stopRainbow();
            displayArea.style.backgroundColor = color;
        }

        presetSwatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                const color = swatch.dataset.color;
                colorPicker.value = color;
                setStaticColor(color);
                enterFullscreen();
            });
        });

        showStaticBtn.addEventListener('click', () => {
            setStaticColor(colorPicker.value);
            enterFullscreen();
        });
        
        colorPicker.addEventListener('input', () => {
            setStaticColor(colorPicker.value);
        });

        // --- 動態彩虹 ---
        let hue = 0;
        
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rainbowStep() {
            const speed = parseInt(rainbowSpeedSlider.value, 10);
            
            if (rainbowModeSelect.value === 'spectrum' || customColors.length < 2) {
                // 全光譜模式
                hue = (hue + speed / 5) % 360;
                displayArea.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
            } else {
                // 自訂序列模式 (平滑漸變)
                seqProgress += speed * 0.5; // 調整速度係數
                if (seqProgress >= 100) {
                    seqProgress = 0;
                    seqIndex = (seqIndex + 1) % customColors.length;
                }
                
                const color1 = hexToRgb(customColors[seqIndex]);
                const color2 = hexToRgb(customColors[(seqIndex + 1) % customColors.length]);
                const factor = seqProgress / 100;
                
                const r = Math.round(color1.r + (color2.r - color1.r) * factor);
                const g = Math.round(color1.g + (color2.g - color1.g) * factor);
                const b = Math.round(color1.b + (color2.b - color1.b) * factor);
                
                displayArea.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            }
            rainbowAnimationId = requestAnimationFrame(rainbowStep);
        }

        function startRainbow() {
            if (rainbowAnimationId) return;
            rainbowStep();
        }

        function stopRainbow() {
            if (rainbowAnimationId) {
                cancelAnimationFrame(rainbowAnimationId);
                rainbowAnimationId = null;
            }
        }

        showRainbowBtn.addEventListener('click', () => {
            startRainbow();
            enterFullscreen();
        });

        // --- 全螢幕控制 ---
        function enterFullscreen() {
            displayArea.style.display = 'flex';
            
            // 隱藏導覽列與公告欄
            const navbar = document.getElementById('custom-navbar');
            const annBar = document.getElementById('announcement-bar');
            if (navbar) navbar.style.display = 'none';
            if (annBar) annBar.style.display = 'none';

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }

        function exitFullscreen() {
            displayArea.style.display = 'none';
            stopRainbow();
            
            // 恢復導覽列與公告欄
            const navbar = document.getElementById('custom-navbar');
            const annBar = document.getElementById('announcement-bar');
            if (navbar) navbar.style.display = 'flex';
            // 公告欄需檢查是否被使用者關閉過，這裡簡單恢復顯示，或依賴 navbar.js 的邏輯
            if (annBar && sessionStorage.getItem('ann-closed') !== 'true') annBar.style.display = 'flex';
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                exitFullscreen();
            } else {
                hint.style.display = 'block';
                hint.style.opacity = '1';
                
                // 3秒後自動隱藏提示
                if (hintTimeout) clearTimeout(hintTimeout);
                hintTimeout = setTimeout(() => {
                    hint.style.opacity = '0';
                    setTimeout(() => hint.style.display = 'none', 500); // 等待淡出動畫結束
                }, 3000);
            }
        });
        
        // 退出全螢幕時也隱藏提示
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && document.fullscreenElement) {
                hint.style.display = 'none';
            }
        });

    </script>
</body>
</html>
