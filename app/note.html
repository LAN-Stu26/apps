<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密雲端筆記 - LAN Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd966; --bg: #1d1d1d; --card: #2d2d2d; --danger: #e74c3c; --accent: #4a4a4a; }
        
        /* 強制隱藏 navbar.js 產生的頁尾 */
        #custom-footer { display: none !important; }

        body { 
            background-color: var(--bg); 
            color: white; 
            margin: 0; 
            font-family: 'Noto Sans TC', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 防止整體頁面捲動，由內部容器處理 */
            padding-top: 80px;
            padding-bottom: 0; /* 移除底部空間 */
            box-sizing: border-box;
        }

        /* 佈局容器 - 修正高度讓側邊欄可捲動 */
        .main-layout { 
            display: flex; 
            flex: 1;
            max-width: 1400px; 
            margin: 0 auto;
            gap: 20px; 
            padding: 0 20px 20px 20px; 
            width: 100%;
            box-sizing: border-box;
            height: calc(100vh - 100px); /* 扣除 header 空間 */
        }
        
        /* 左側筆記清單 */
        .sidebar { 
            width: 320px; 
            background: var(--card); 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid #333;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .sidebar-header { 
            padding: 15px; 
            background: #333; 
            border-bottom: 1px solid var(--gold);
        }

        .header-top {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 10px;
        }

        .search-box {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 10px;
            color: white;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        .add-btn { 
            cursor: pointer; 
            color: var(--gold); 
            font-size: 1.5rem; 
            background: none; 
            border: none; 
            line-height: 1;
        }

        #note-list { 
            flex: 1; 
            overflow-y: auto; /* 確保內容過多時可滑動 */
            list-style: none; 
            margin: 0; 
            padding: 0; 
            -webkit-overflow-scrolling: touch; /* 優化手機滑動 */
        }

        #note-list li { 
            padding: 15px; 
            border-bottom: 1px solid #3d3d3d; 
            cursor: pointer; 
            transition: 0.2s;
            color: #bbb;
            word-break: break-all;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .note-time { font-size: 0.7rem; color: #666; }

        #note-list li:hover { background: #3d3d3d; color: white; }
        #note-list li.active { 
            border-left: 4px solid var(--gold); 
            background: #3d3d3d; 
            color: var(--gold);
            font-weight: bold;
        }

        /* 右側編輯器 */
        .editor-area { 
            flex: 1; 
            background: var(--card); 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            position: relative; 
            border: 1px solid #333;
            overflow: hidden;
        }

        .toolbar { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 15px; 
            border-bottom: 1px solid #444; 
            padding-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar button { 
            background: #444; 
            border: none; 
            color: white; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 0.9rem;
        }

        .toolbar button:hover { background: var(--gold); color: black; }
        .mobile-back { display: none; background: #555 !important; }

        #editor-title { 
            background: transparent; 
            border: none; 
            color: var(--gold); 
            font-size: 1.5rem; 
            font-weight: bold; 
            outline: none; 
            margin-bottom: 10px; 
            width: 100%;
        }

        #editor-body { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: #ddd; 
            outline: none; 
            overflow-y: auto; 
            line-height: 1.6; 
            font-size: 1.05rem;
        }

        #editor-body[contenteditable]:empty:before { 
            content: "在這裡輸入內容..."; 
            color: #666; 
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 5px;
        }

        #save-indicator, #word-count { 
            font-size: 0.75rem; 
            color: #666; 
        }

        /* 全螢幕模式 */
        .full-focus .sidebar { display: none; }
        .full-focus .main-layout { max-width: 100%; }

        @media (max-width: 768px) {
            .main-layout { margin-top: 0; gap: 0; padding: 0 10px; height: calc(100vh - 90px); }
            .sidebar { width: 100%; }
            .editor-area { display: none; }
            body.editing .sidebar { display: none; }
            body.editing .editor-area { display: flex; width: 100%; }
            body.editing .mobile-back { display: block; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1d1d1d; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="main-layout" id="main-ui" style="display: none;">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="header-top">
                    <span>我的筆記 🔐</span>
                    <button class="add-btn" id="add-note-btn" title="新增筆記">+</button>
                </div>
                <input type="text" class="search-box" id="search-input" placeholder="搜尋筆記標題...">
            </div>
            <ul id="note-list"></ul>
        </div>

        <div class="editor-area" id="editor-container" style="visibility: hidden;">
            <div class="toolbar">
                <button class="mobile-back" onclick="closeEditor()">← 返回</button>
                <button onclick="execCmd('bold')" title="粗體"><b>B</b></button>
                <button onclick="execCmd('italic')" title="斜體"><i>I</i></button>
                <button onclick="execCmd('underline')" title="底線"><u>U</u></button>
                <button onclick="execCmd('createLink', prompt('網址:'))" title="插入連結">🔗</button>
                <button onclick="toggleFocus()" title="專注模式">🔲</button>
                <button onclick="deleteCurrentNote()" style="background:var(--danger); margin-left:auto;">🗑️ 刪除</button>
            </div>
            <input type="text" id="editor-title" placeholder="無標題筆記">
            <div id="editor-body" contenteditable="true"></div>
            <div class="status-bar">
                <div id="word-count">字數：0</div>
                <div id="save-indicator">已加密儲存</div>
            </div>
        </div>

        <div id="no-note-selected" style="flex:1; display:flex; justify-content:center; align-items:center; color:#555; text-align:center;">
            <h3>請選擇或新增筆記</h3>
        </div>
    </div>

    <div id="login-overlay" style="display: none;"><h2>🔐 請先登入以開啟加密空間</h2></div>

    <script type="module">
        import { auth } from "/navbar.app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, where, orderBy, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const db = getFirestore();
        let currentNoteId = null;
        let saveTimeout = null;
        let allNotes = []; // 暫存所有筆記用於搜尋

        const encrypt = (text, key) => CryptoJS.AES.encrypt(text, key).toString();
        const decrypt = (ciphertext, key) => {
            if (!ciphertext) return "";
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, key);
                return bytes.toString(CryptoJS.enc.Utf8) || "";
            } catch (e) { return " (解密失敗) "; }
        };

        // 輔助函式：格式化時間
        const formatTime = (ts) => {
            if (!ts) return "";
            const date = ts.toDate();
            return `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
        };

        window.execCmd = (cmd, val = null) => {
            document.execCommand(cmd, false, val);
            saveData();
        };

        window.closeEditor = () => {
            document.body.classList.remove('editing');
        };

        window.toggleFocus = () => {
            document.body.classList.toggle('full-focus');
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('main-ui').style.display = 'flex';
                document.getElementById('login-overlay').style.display = 'none';
                loadNoteList(user.uid);
            } else {
                document.getElementById('main-ui').style.display = 'none';
                document.getElementById('login-overlay').style.display = 'block';
            }
        });

        function loadNoteList(uid) {
            const q = query(collection(db, "notes"), where("uid", "==", uid), orderBy("updatedAt", "desc"));
            onSnapshot(q, (snapshot) => {
                allNotes = [];
                snapshot.forEach(doc => allNotes.push({ id: doc.id, ...doc.data() }));
                renderList(allNotes);
            });
        }

        function renderList(notes) {
            const listEl = document.getElementById('note-list');
            const uid = auth.currentUser.uid;
            listEl.innerHTML = "";
            
            notes.forEach((data) => {
                const decTitle = decrypt(data.title, uid) || "無標題筆記";
                const timeStr = formatTime(data.updatedAt);
                
                const li = document.createElement('li');
                li.innerHTML = `<span>${decTitle}</span><span class="note-time">${timeStr}</span>`;
                li.dataset.id = data.id;
                
                if (data.id === currentNoteId) li.className = "active";
                
                li.onclick = () => {
                    document.querySelectorAll('#note-list li').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    selectNote(data.id, data);
                };
                listEl.appendChild(li);
            });
        }

        // 搜尋功能
        document.getElementById('search-input').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const uid = auth.currentUser.uid;
            const filtered = allNotes.filter(n => {
                const title = decrypt(n.title, uid).toLowerCase();
                return title.includes(term);
            });
            renderList(filtered);
        };

        function selectNote(id, data) {
            currentNoteId = id;
            const key = auth.currentUser.uid;
            
            document.getElementById('no-note-selected').style.display = 'none';
            document.getElementById('editor-container').style.visibility = 'visible';
            document.body.classList.add('editing');
            
            document.getElementById('editor-title').value = decrypt(data.title, key);
            document.getElementById('editor-body').innerHTML = decrypt(data.content, key);
            updateWordCount();
        }

        document.getElementById('add-note-btn').onclick = async () => {
            if (!auth.currentUser) return;
            const key = auth.currentUser.uid;
            const newNoteRef = doc(collection(db, "notes"));
            const initialTitle = "新筆記";
            const newData = {
                uid: key,
                title: encrypt(initialTitle, key),
                content: encrypt("", key),
                updatedAt: serverTimestamp()
            };
            await setDoc(newNoteRef, newData);
            selectNote(newNoteRef.id, newData);
        };

        function updateWordCount() {
            const text = document.getElementById('editor-body').innerText || "";
            document.getElementById('word-count').innerText = `字數：${text.trim().length}`;
        }

        function saveData() {
            if (!currentNoteId || !auth.currentUser) return;
            const key = auth.currentUser.uid;
            const indicator = document.getElementById('save-indicator');
            indicator.innerText = "🔐 同步中...";
            
            updateWordCount();
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const titleVal = document.getElementById('editor-title').value;
                const bodyVal = document.getElementById('editor-body').innerHTML;
                
                try {
                    await setDoc(doc(db, "notes", currentNoteId), {
                        title: encrypt(titleVal || "無標題筆記", key),
                        content: encrypt(bodyVal, key),
                        updatedAt: serverTimestamp()
                    }, { merge: true });
                    indicator.innerText = "✅ 已加密儲存";
                } catch (e) {
                    indicator.innerText = "❌ 儲存失敗";
                }
            }, 1000);
        }

        window.deleteCurrentNote = async () => {
            if (currentNoteId && confirm("確定要永久刪除此筆記嗎？")) {
                await deleteDoc(doc(db, "notes", currentNoteId));
                document.getElementById('editor-container').style.visibility = 'hidden';
                document.getElementById('no-note-selected').style.display = 'flex';
                currentNoteId = null;
                closeEditor();
            }
        };

        document.getElementById('editor-title').oninput = saveData;
        document.getElementById('editor-body').oninput = saveData;
    </script>
    <script type="module" src="/navbar.app.js"></script>
</body>
</html>
