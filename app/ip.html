<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 查詢工具 - LAN Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #ffd966;
            --bg-color: #1d1d1d;
            --secondary-dark: #2a2a2a;
            --error-red: #ff5e5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .app-container {
            max-width: 800px;
            width: 95%;
            margin: 20px auto;
            text-align: center;
        }

        h1 {
            color: var(--primary-dark);
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 2.2rem;
        }

        .search-section {
            background: var(--secondary-dark);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #444;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid #555;
            margin-bottom: 20px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            font-size: 1.1rem;
            outline: none;
        }

        .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        button {
            background-color: var(--primary-dark);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button.secondary { background-color: #444; color: white; }

        .result-card {
            background: var(--secondary-dark);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #444;
            text-align: left;
            display: none;
            margin-bottom: 25px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-item {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #3d3d3d;
            padding-bottom: 8px;
        }

        .result-item span:last-child { color: var(--primary-dark); font-weight: bold; }

        #map-container {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #444;
            overflow: hidden;
            background: #111;
        }

        .history-section {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 15px;
            text-align: left;
            width: 100%;
            margin-bottom: 40px;
            border: 1px dashed #444;
        }

        .history-list { list-style: none; margin-top: 15px; }
        
        .history-item {
            background: #252525;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            transition: 0.2s;
            overflow: hidden;
        }

        .history-content {
            flex: 1;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .history-item:hover { background: #333; }

        .delete-single {
            padding: 12px 18px;
            color: #666;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            transition: 0.2s;
            border-left: 1px solid #3d3d3d;
        }

        .delete-single:hover {
            color: var(--error-red);
            background: rgba(255, 94, 94, 0.1);
        }

        #status-display { margin: 10px 0; font-size: 1rem; color: #888; }
        .error-text { color: var(--error-red) !important; }
        
        .map-link-btn {
            display: inline-block; margin-top: 15px; color: var(--primary-dark);
            text-decoration: none; font-size: 0.85rem; border: 1px solid var(--primary-dark);
            padding: 4px 12px; border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>IP GEOLOCATION</h1>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="ip-input" placeholder="輸入 IP (例如 8.8.8.8) 或 'my'...">
            </div>
            <div class="controls">
                <button id="search-btn">🔍 查詢位置</button>
                <button id="my-ip-btn" class="secondary">📍 我的位置</button>
                <button id="clear-history-btn" class="secondary">🗑 全部清除</button>
            </div>
            <div id="status-display">準備就緒</div>
        </div>

        <div id="result-container" class="result-card">
            <div class="result-item"><span style="color: #fff;"><b>國家:</b></span> <span id="res-country">-</span></div>
            <div class="result-item"><span style="color: #fff;"><b>城市:</b></span> <span id="res-city">-</span></div>
            <div class="result-item"><span style="color: #fff;"><b>區域/省份:</b></span> <span id="res-region">-</span></div>
            <div class="result-item"><span style="color: #fff;"><b>時區:</b></span> <span id="res-timezone">-</span></div>
            <div class="result-item"><span style="color: #fff;"><b>ISP 業者:</b></span> <span id="res-isp">-</span></div>
            <div class="result-item"><span style="color: #fff;"><b>經緯度:</b></span> <span id="res-coords">-</span></div>
            
            <div id="map-container">
                <iframe id="google-map" width="100%" height="100%" frameborder="0" style="border:0" allowfullscreen></iframe>
            </div>
            <div style="text-align: right;">
                <a id="map-link" href="#" target="_blank" class="map-link-btn">在 Google 地圖中開啟 ↗</a>
            </div>
        </div>

        <div class="history-section">
            <h3 style="color: var(--primary-dark);">查詢紀錄</h3>
            <ul id="history-list" class="history-list" style="color: #fff; font-weight: bold;"><b>
                </ul>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="navbar.js"></script>

    <script>
        const ipInput = document.getElementById('ip-input');
        const statusDisplay = document.getElementById('status-display');
        const resultContainer = document.getElementById('result-container');
        const historyList = document.getElementById('history-list');

        let searchHistory = JSON.parse(localStorage.getItem('ip_history')) || [];
        renderHistory();

        async function fetchIPLocation(ip = "") {
            statusDisplay.textContent = "正在獲取地理位置 (CORS 安全連線)...";
            statusDisplay.classList.remove('error-text');
            
            // 使用 ipapi.co，這對靜態網站前端請求較友善
            const apiUrl = ip ? `https://ipapi.co/${ip}/json/` : `https://ipapi.co/json/`;
            
            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error("API 回傳錯誤");
                
                const data = await response.json();

                if (!data.error) {
                    displayResult(data);
                    saveToHistory(data);
                } else {
                    statusDisplay.textContent = `[ 錯誤 ] ${data.reason || '查詢失敗'}`;
                    statusDisplay.classList.add('error-text');
                }
            } catch (error) {
                statusDisplay.textContent = "[ 錯誤 ] 無法取得資料，可能達到每日上限或 CORS 攔截";
                statusDisplay.classList.add('error-text');
                console.error(error);
            }
        }

        function displayResult(data) {
            document.getElementById('res-country').textContent = data.country_name || "-";
            document.getElementById('res-city').textContent = data.city || "-";
            document.getElementById('res-region').textContent = data.region || "-";
            document.getElementById('res-timezone').textContent = data.timezone || "-";
            document.getElementById('res-isp').textContent = data.org || "-";
            document.getElementById('res-coords').textContent = `${data.latitude}, ${data.longitude}`;
            
            const lat = data.latitude;
            const lon = data.longitude;
            
            // Google Maps Embed
            const mapUrl = `https://maps.google.com/maps?q=${lat},${lon}&z=14&output=embed`;
            document.getElementById('google-map').src = mapUrl;
            document.getElementById('map-link').href = `https://www.google.com/maps?q=${lat},${lon}`;

            resultContainer.style.display = "block";
            statusDisplay.textContent = `查詢成功: ${data.ip}`;
        }

        function saveToHistory(data) {
            const timestamp = Date.now();
            const record = {
                id: timestamp,
                ip: data.ip,
                location: `${data.country_name} ${data.city}`,
                time: new Date().toLocaleTimeString()
            };
            
            // 避免重複
            if (searchHistory.length > 0 && searchHistory[0].ip === data.ip) return;

            searchHistory.unshift(record);
            if (searchHistory.length > 15) searchHistory.pop(); 
            localStorage.setItem('ip_history', JSON.stringify(searchHistory));
            renderHistory();
        }

        function renderHistory() {
            if (searchHistory.length === 0) {
                historyList.innerHTML = '<li style="color:#666; font-size:0.9rem;">目前沒有查詢紀錄</li>';
                return;
            }
            historyList.innerHTML = searchHistory.map((item) => `
                <li class="history-item">
                    <div class="history-content" onclick="reSearch('${item.ip}')">
                        <span>${item.ip}</span>
                        <span style="color:#888;">${item.location} (${item.time})</span>
                    </div>
                    <div class="delete-single" onclick="deleteItem(${item.id})" title="刪除此筆">×</div>
                </li>
            `).join('');
        }

        window.deleteItem = function(id) {
            searchHistory = searchHistory.filter(item => item.id !== id);
            localStorage.setItem('ip_history', JSON.stringify(searchHistory));
            renderHistory();
        };

        window.reSearch = function(ip) {
            ipInput.value = ip;
            fetchIPLocation(ip);
        };

        document.getElementById('search-btn').onclick = () => {
            const val = ipInput.value.trim();
            if (val.toLowerCase() === 'my') fetchIPLocation("");
            else if (val) fetchIPLocation(val);
        };

        document.getElementById('my-ip-btn').onclick = () => {
            ipInput.value = "my";
            fetchIPLocation("");
        };

        document.getElementById('clear-history-btn').onclick = () => {
            if(confirm("確定要刪除所有紀錄嗎？")) {
                searchHistory = [];
                localStorage.removeItem('ip_history');
                renderHistory();
            }
        };

        ipInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('search-btn').click();
        });
    </script>
</body>
</html>
