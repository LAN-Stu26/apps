<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記分板 - LAN Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #1d1d1d;
            --secondary-dark: #2a2a2a;
            --primary-yellow: #ffd966;
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* 標題動畫 */
        #main-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--primary-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            transition: opacity var(--transition-speed);
        }

        #scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            margin-bottom: 40px;
            transition: all var(--transition-speed) ease-in-out;
        }

        /* 隊伍卡片交互動畫 */
        .team-card {
            background: var(--secondary-dark);
            padding: 25px;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.4s;
            position: relative;
        }

        .team-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .team-name {
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 15px;
            background: transparent;
            border: none;
            text-align: center;
            width: 100%;
            outline: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .team-name:focus { border-bottom-color: var(--primary-yellow); }

        .win-display {
            font-size: 1rem;
            margin-bottom: 5px;
            font-weight: bold;
            opacity: 0.9;
        }

        /* 分數縮放動畫 */
        .score-display {
            font-size: 6.5rem;
            font-weight: 800;
            margin: 5px 0;
            cursor: pointer;
            line-height: 1;
            user-select: none;
            transition: transform 0.1s active, color 0.4s;
        }

        .score-display:active { transform: scale(0.9); }
        .score-bump { animation: scoreBump 0.3s ease-out; }
        @keyframes scoreBump {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* 快速顏色切換鈕 */
        .color-picker-inline {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .team-card:hover .color-picker-inline { opacity: 1; }
        
        .color-dot {
            width: 18px; height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
            transition: transform 0.2s;
        }
        .color-dot:hover { transform: scale(1.3); border-color: #fff; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.05);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sm:hover { background: rgba(255,255,255,0.15); color: #fff; }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            transition: opacity 0.3s;
        }

        button.main-btn {
            background-color: var(--primary-yellow);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(255, 217, 102, 0.2);
        }
        button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 217, 102, 0.3); }

        /* --- 全螢幕徹底隱藏 Navbar/Footer --- */
        body.fullscreen { background-color: black !important; }
        body.fullscreen #custom-navbar, 
        body.fullscreen #custom-footer, 
        body.fullscreen #announcement-bar {
            display: none !important;
            visibility: hidden !important;
        }
        body.fullscreen > *:not(#custom-navbar):not(#custom-footer):not(#announcement-bar) {
            padding-top: 0 !important;
            margin-top: 0 !important;
        }
        body.fullscreen #main-title, body.fullscreen .controls, 
        body.fullscreen .btn-group, body.fullscreen .color-picker-inline {
            display: none !important;
        }
        body.fullscreen .team-card { background: transparent; border: none; box-shadow: none; transform: none; }
        body.fullscreen .score-display { font-size: 20vw; }

        /* --- 彈窗 --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2147483647;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background-color: var(--secondary-dark);
            margin: 10% auto;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            border: 1px solid #444;
        }

        @media (max-width: 768px) {
            .score-display { font-size: 5rem; }
            #scoreboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="main-title">Professional Scoreboard</h1>
        <div id="scoreboard"></div>
        <div class="controls">
            <button class="main-btn" id="settings-btn">⚙️ 隊伍數量</button>
            <button class="main-btn" style="background: transparent; border: 1px solid #555; color: #888;" id="reset-scores-btn">🔄 歸零</button>
            <button class="main-btn" id="fullscreen-btn">⛶ 全螢幕模式</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-yellow); margin-bottom: 25px; text-align: center;">賽事設定</h2>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <span>顯示隊伍數量 (2-6)</span>
                <input type="number" id="teamCountInput" min="2" max="6" style="width: 60px; background: #111; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 8px;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="apply-settings-btn" class="main-btn" style="flex: 1;">確認</button>
                <button onclick="closeModal('settingsModal')" class="main-btn" style="flex: 1; background: #333; color: #eee;">取消</button>
            </div>
        </div>
    </div>

    <script>
        const THEME_COLORS = ['#ffd966', '#ff6666', '#66ff66', '#66ccff', '#cc66ff', '#ffffff'];
        
        let state = {
            teamCount: 2,
            teams: [
                { name: '隊伍 1', wins: 0, score: 0, color: THEME_COLORS[0] },
                { name: '隊伍 2', wins: 0, score: 0, color: THEME_COLORS[1] },
                { name: '隊伍 3', wins: 0, score: 0, color: THEME_COLORS[2] },
                { name: '隊伍 4', wins: 0, score: 0, color: THEME_COLORS[3] },
                { name: '隊伍 5', wins: 0, score: 0, color: THEME_COLORS[4] },
                { name: '隊伍 6', wins: 0, score: 0, color: THEME_COLORS[5] }
            ]
        };

        function loadState() {
            const saved = localStorage.getItem('scoreboardStateV3');
            if (saved) state = JSON.parse(saved);
            renderScoreboard();
        }

        function saveState() {
            localStorage.setItem('scoreboardStateV3', JSON.stringify(state));
        }

        function renderScoreboard() {
            const container = document.getElementById('scoreboard');
            container.innerHTML = '';
            for (let i = 0; i < state.teamCount; i++) {
                const team = state.teams[i];
                const card = document.createElement('div');
                card.className = 'team-card';
                card.style.borderColor = team.color + '33';
                
                // 生成顏色快速選擇按鈕
                const colorDots = THEME_COLORS.map(c => 
                    `<div class="color-dot" style="background: ${c}" onclick="changeTeamColor(${i}, '${c}')"></div>`
                ).join('');

                card.innerHTML = `
                    <input type="text" class="team-name" value="${team.name}" onchange="updateTeamName(${i}, this.value)">
                    <div class="win-display" style="color: ${team.color}aa">WINS: <span>${team.wins}</span></div>
                    <div id="score-${i}" class="score-display" style="color: ${team.color}" onclick="animateScore(${i}, 1)">${team.score}</div>
                    
                    <div class="color-picker-inline">${colorDots}</div>

                    <div class="btn-group">
                        <button class="btn-sm" onclick="changeScore(${i}, -1)">- 分</button>
                        <button class="btn-sm" style="border-color: ${team.color}88; color: ${team.color}" onclick="changeWin(${i}, 1)">+ 局</button>
                        <button class="btn-sm" onclick="changeWin(${i}, -1)">- 局</button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function animateScore(index, delta) {
            const el = document.getElementById(`score-${index}`);
            el.classList.remove('score-bump');
            void el.offsetWidth; // 觸發重繪以重啟動畫
            el.classList.add('score-bump');
            changeScore(index, delta);
        }

        function changeTeamColor(index, color) {
            state.teams[index].color = color;
            saveState();
            renderScoreboard();
        }

        function updateTeamName(index, val) { state.teams[index].name = val; saveState(); }
        function changeScore(index, delta) { state.teams[index].score = Math.max(0, state.teams[index].score + delta); saveState(); renderScoreboard(); }
        function changeWin(index, delta) { state.teams[index].wins = Math.max(0, state.teams[index].wins + delta); saveState(); renderScoreboard(); }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => document.body.classList.add('fullscreen'));
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) document.body.classList.remove('fullscreen');
        });

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        document.getElementById('settings-btn').onclick = () => {
            document.getElementById('teamCountInput').value = state.teamCount;
            document.getElementById('settingsModal').style.display = 'block';
        };

        document.getElementById('apply-settings-btn').onclick = () => {
            state.teamCount = parseInt(document.getElementById('teamCountInput').value);
            saveState();
            renderScoreboard();
            closeModal('settingsModal');
        };

        document.getElementById('reset-scores-btn').onclick = () => {
            if(confirm('重設比分與勝場？')) {
                state.teams.forEach(t => { t.score = 0; t.wins = 0; });
                saveState(); renderScoreboard();
            }
        };

        document.getElementById('fullscreen-btn').onclick = toggleFullscreen;

        loadState();
    </script>

    <script type="module" src="/navbar.app.js" defer></script>
</body>
</html>
