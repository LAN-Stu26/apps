<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紓壓按鈕 - LAN Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Black+Ops+One&display=swap" rel="stylesheet">
    <link rel="icon" href="圖片/標籤頭像.png">

    <style>
        :root {
            --primary-dark: #ffd966;
            --bg-color: #1d1d1d;
            --secondary-dark: #2a2a2a;
            --accent-glow: rgba(255, 217, 102, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        /* --- 紓壓按鈕設計 --- */
        .button-stage {
            position: relative;
            margin-bottom: 30px;
            z-index: 5;
        }

        #stress-button {
            width: 220px;
            height: 220px;
            background-color: var(--primary-dark);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(255, 217, 102, 0.4);
            transition: transform 0.1s, box-shadow 0.2s, background-color 0.3s;
            font-size: 2rem;
            color: var(--bg-color);
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            outline: none;
        }

        #stress-button:active {
            transform: scale(0.9);
        }

        #stress-button.charging {
            background-color: #fff;
            box-shadow: 0 0 80px #fff, 0 0 120px var(--primary-dark);
            animation: shake 0.08s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) scale(0.9); }
            50% { transform: translate(-2px, -3px) scale(0.9); }
            100% { transform: translate(2px, -1px) scale(0.9); }
        }

        #click-count {
            font-size: 1.4rem;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* --- 稱讚文字視覺強化 --- */
        .combo-text {
            position: absolute;
            font-family: 'Black Ops One', cursive, system-ui;
            font-weight: bold;
            font-size: 3.5rem;
            color: var(--primary-dark);
            text-shadow: 
                4px 4px 0px #000, 
                -1px -1px 0px #000,
                0 0 30px var(--accent-glow);
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
            animation: popAndFloat 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popAndFloat {
            0% { transform: translate(-50%, 0) scale(0.3) rotate(-15deg); opacity: 0; }
            30% { transform: translate(-50%, -60px) scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: translate(-50%, -180px) scale(1) rotate(0deg); opacity: 0; }
        }

        /* --- 操作按鈕區 --- */
        .controls {
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button.tool-btn {
            background-color: var(--secondary-dark);
            color: var(--primary-dark);
            border: 2px solid var(--primary-dark);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        button.tool-btn:hover {
            background-color: var(--primary-dark);
            color: var(--bg-color);
        }

        /* --- 設定彈窗 --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background-color: var(--secondary-dark);
            margin: 15vh auto;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            border: 1px solid #444;
        }

        .setting-item {
            margin: 25px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        input[type="range"] { accent-color: var(--primary-dark); cursor: pointer; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }

        #audio-upload { display: none; }
    </style>
</head>
<body>

    <div class="container" id="game-area">
        <h1 style="font-size: 1rem; color: var(--primary-dark); opacity: 0.5; margin-bottom: 20px; letter-spacing: 5px; font-family: 'Black Ops One';">STRESS LESS</h1>
        
        <div class="button-stage">
            <button id="stress-button">PUSH</button>
        </div>

        <div id="click-count">能量釋放總計: <span id="count-num" style="color: white; font-weight: bold;">0</span></div>

        <div class="controls">
            <button class="tool-btn" id="settings-btn">⚙️ 功能設定</button>
            <button class="tool-btn" id="reset-btn">🔄 數據重設</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-dark); margin-bottom: 25px; text-align: center;">個人偏好設定</h2>
            
            <div class="setting-item">
                <span>連擊文字特效</span>
                <input type="checkbox" id="combo-toggle" checked>
            </div>

            <div class="setting-item">
                <span>主音量控制</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
            </div>

            <div class="setting-item" style="border-top: 1px solid #444; padding-top: 25px;">
                <span>上傳自訂音效</span>
                <button class="tool-btn" style="padding: 6px 16px; font-size: 0.9rem;" onclick="document.getElementById('audio-upload').click()">選擇檔案</button>
            </div>

            <button class="tool-btn" id="close-settings" style="width: 100%; margin-top: 20px; background: var(--primary-dark); color: var(--bg-color);">儲存並關閉</button>
        </div>
    </div>

    <input type="file" id="audio-upload" accept="audio/*">
    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        let count = parseInt(localStorage.getItem('stress_clicks')) || 0;
        let lastClickTime = 0;
        let comboCount = 0;
        let pressTimer;
        
        const state = {
            comboEnabled: true,
            volume: 0.5
        };

        const btn = document.getElementById('stress-button');
        const countDisplay = document.getElementById('count-num');
        const audio = document.getElementById('pop-sound');
        const modal = document.getElementById('settingsModal');

        countDisplay.textContent = count;

        // --- 互動邏輯 ---
        btn.addEventListener('mousedown', (e) => { if(e.button === 0) startPress(); });
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); });
        window.addEventListener('mouseup', endPress);
        window.addEventListener('touchend', endPress);
        btn.addEventListener('click', handleClick);

        function handleClick() {
            if (btn.classList.contains('charging')) return;

            audio.currentTime = 0;
            audio.volume = state.volume;
            audio.play().catch(()=>{});

            count++;
            countDisplay.textContent = count;
            localStorage.setItem('stress_clicks', count);

            if (state.comboEnabled) {
                const now = Date.now();
                if (now - lastClickTime < 450) {
                    comboCount++;
                    if (comboCount >= 2) showComboText(false);
                } else {
                    comboCount = 0;
                }
                lastClickTime = now;
            }
        }

        // --- 連擊與稱讚文字 (保持英文) ---
        const comboWords = ["NICE!", "GREAT!", "AWESOME!", "PERFECT!", "AMAZING!", "EXCELLENT!", "UNSTOPPABLE!", "GODLIKE!"];
        function showComboText(isSuper) {
            const text = document.createElement('div');
            text.className = 'combo-text';
            if (isSuper) {
                text.textContent = "SUPER CHARGE!!";
                text.style.color = "#fff";
                text.style.fontSize = "4rem";
            } else {
                text.textContent = comboWords[Math.min(comboCount - 2, comboWords.length - 1)];
            }
            
            text.style.left = `50%`;
            text.style.top = `40%`;
            
            document.getElementById('game-area').appendChild(text);
            setTimeout(() => text.remove(), 700);
        }

        function startPress() {
            pressTimer = setTimeout(() => {
                btn.classList.add('charging');
            }, 600);
        }

        function endPress() {
            if (btn.classList.contains('charging')) {
                releaseSuperClick();
            }
            clearTimeout(pressTimer);
            btn.classList.remove('charging');
        }

        function releaseSuperClick() {
            count += 15;
            countDisplay.textContent = count;
            localStorage.setItem('stress_clicks', count);
            if (state.comboEnabled) showComboText(true);
            
            const area = document.getElementById('game-area');
            area.style.animation = "shakeArea 0.2s ease-in-out";
            setTimeout(() => area.style.animation = "", 200);
        }

        // --- 中文操作邏輯 ---
        document.getElementById('settings-btn').onclick = () => modal.style.display = 'block';
        document.getElementById('close-settings').onclick = () => modal.style.display = 'none';
        document.getElementById('combo-toggle').onchange = (e) => state.comboEnabled = e.target.checked;
        document.getElementById('volume-slider').oninput = (e) => state.volume = e.target.value;

        document.getElementById('audio-upload').onchange = function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    audio.src = e.target.result;
                    alert('音效更換成功！');
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('reset-btn').onclick = () => {
            if(confirm('確定要歸零所有能量數據嗎？')) {
                count = 0;
                countDisplay.textContent = count;
                localStorage.setItem('stress_clicks', 0);
            }
        };

        window.onclick = (e) => { if(e.target == modal) modal.style.display = 'none'; };
    </script>
    
    <script type="module" src="./navbar.js"></script>
</body>
</html>
