<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欣氏 - 合作商家介紹</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/圖片/欣氏icon.png">
    <style>
        :root {
            --primary-color: #ffd966;
            --bg-color: #1d1d1d;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-blue: #3498db;
        }

        /* 安全更新：預設隱藏內容，並禁用所有指針事件防止未驗證操作 */
        #content-wrapper {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding-top: 70px; 
        }

        /* 驗證通過後的顯示狀態 */
        body.auth-passed #content-wrapper {
            opacity: 1;
            pointer-events: auto;
        }

        /* 驗證中提示 */
        #auth-loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: #1d1d1d; color: #ffd966; z-index: 10000;
            font-size: 1.2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .hero-section {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, var(--bg-color) 100%);
            border-bottom: 1px solid #333;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin: 0 0 15px 0;
            text-shadow: 0 4px 20px rgba(255, 217, 102, 0.2);
            letter-spacing: 4px;
            font-weight: bold;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: #aaa;
            letter-spacing: 2px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .info-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: var(--primary-color);
        }

        .info-item {
            margin-bottom: 30px;
            border-bottom: 1px solid #3d3d3d;
            padding-bottom: 20px;
        }
        
        .info-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .label {
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #eee;
        }

        .value a {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            padding: 6px 16px;
            margin: 4px 0;
            border: 1px solid rgba(255, 217, 102, 0.3);
            border-radius: 8px;
            transition: 0.3s;
            background: rgba(255, 217, 102, 0.05);
        }

        .value a:hover {
            background: var(--primary-color);
            color: #000;
            transform: translateY(-2px);
        }

        .chat-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            margin-top: 10px;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #7f8c8d;
            text-decoration: none;
            transition: 0.3s;
            margin: 40px 0;
            font-weight: bold;
        }
        .back-link:hover { 
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div id="auth-loading">驗證權限中...</div>

    <div id="content-wrapper">
        <div class="hero-section">
            <h1 class="hero-title">欣氏</h1>
            <div class="hero-subtitle">擁有多個聊天室的勢力，合作方為 GCLLT</div>
        </div>

        <div class="container">
            <div class="info-card">
                <div class="info-item">
                    <span class="label">商家介紹</span>
                    <div class="value">
                        <span style="color: #aaa;">: ( 資料被刪除了</span>
                    </div>
                </div>

                <div class="info-item">
                    <span class="label">現任 CEO / 負責人</span>
                    <div class="value">鄭O妍 / 宋O翰</div>
                </div>

                <div class="info-item">
                    <span class="label">合作期間</span>
                    <div class="value">2026</div>
                </div>

                <div class="info-item">
                    <span class="label">聯絡資訊</span>
                    <div class="value">
                        <a href="mailto:tyk6492@apps.ntpc.edu.tw">📧 傳送郵件給負責人</a>
                    </div>
                </div>
                
                <div class="info-item">
                    <span class="label">Google Chat 群組列表</span>
                    <div class="value chat-links">
                        <a href="https://chat.google.com/room/AAQAlMl1CS4?cls=5">🌟 新北群</a>
                        <a href="https://chat.google.com/room/AAQAZHqVEOM?cls=5">🔗 未知群組 (1)</a>
                        <a href="https://chat.google.com/room/AAAAmlqBRGE?cls=5">🔗 未知群組 (2)</a>
                        <a href="https://chat.google.com/room/AAQAlKbJ6cw?cls=5">🔗 未知群組 (3)</a>
                        <a href="https://chat.google.com/room/AAQA-lV-_a0?cls=5">🔗 未知群組 (4)</a>
                        <a href="https://chat.google.com/room/AAQAzanxbUs?cls=5">🔗 未知群組 (5)</a>
                        <a href="https://chat.google.com/room/AAQAJvhaXXk?cls=7">🌟 新北「歡樂」城</a>
                    </div>
                </div>
            </div>

            <a href="/cooperate.html" class="back-link">← 返回合作商家列表</a>
        </div>
    </div>

    <script type="module">
        import { auth } from '/navbar.js'; 
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const loadingScreen = document.getElementById('auth-loading');

        // 封裝權限檢查邏輯
        function checkAccess(user) {
            if (user && user.email && user.email.endsWith('@apps.ntpc.edu.tw')) {
                document.body.classList.add('auth-passed');
                if (loadingScreen) loadingScreen.style.display = 'none';
            } else {
                // 使用 replace 防止在歷史紀錄中留下此頁面，避免返回死循環
                window.location.replace('/1001.html#type:@apps.ntpc.edu.tw');
            }
        }

        // 監聽 Firebase 登入狀態
        onAuthStateChanged(auth, (user) => {
            checkAccess(user);
        });

        // 核心更新：處理瀏覽器 BFCache (解決點擊返回鍵還能看到內容的問題)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                // 如果是從快取讀取，立即重新隱藏內容並檢查權持
                document.body.classList.remove('auth-passed');
                if (loadingScreen) loadingScreen.style.display = 'flex';
                checkAccess(auth.currentUser);
            }
        });
    </script>
    <script type="module" src="/navbar.js"></script>
</body>
</html>
