# LAN Studio 隱私權政策

**生效日期：** 2026年3月28日

LAN Studio（以下簡稱「我們」或「本網站」）致力於保護您的個人隱私。本隱私權政策旨在說明當您使用我們的網站及服務時，我們如何收集、使用、處理和保護您的個人資訊。我們承諾會以透明且負責任的方式處理您的個人資料。

## 1. 我們收集的資訊

當您使用 LAN Studio 的服務時，我們可能會收集以下類型的資訊：

### 1.1 您直接提供的資訊

*   **帳戶資訊**：當您透過 Google 帳戶登入我們的會員專屬服務時，我們可能會從 Google 接收您的基本個人資料，例如您的電子郵件地址、名稱以及頭像。這些資訊用於建立和管理您的會員帳戶，並提供個人化的服務體驗。
*   **聯絡資訊**：當您填寫「徵求網頁翻譯人員」表單、提供網站改善建議或透過聯絡表單與我們聯繫時，我們可能會收集您的稱呼或匿名、電子郵件地址、擅長語言、相關經驗以及您提供的任何回饋內容。這些資訊用於回應您的查詢、處理您的申請或改進我們的服務。
*   **使用者生成內容**：當您使用「加密雲端筆記」或「HTML Editor」等工具時，您所輸入或創建的內容將會被儲存。其中，「加密雲端筆記」的內容會使用 AES-256 加密技術進行保護，以確保您的資料安全。

### 1.2 自動收集的資訊

*   **使用資料**：我們可能會自動收集您如何存取和使用本網站的資訊，包括您的 IP 位址。這些資料用於分析網站流量，並改善我們的服務功能和用戶體驗。
*   **Cookie 和追蹤技術**：我們使用 Cookie 和類似的追蹤技術（如網路信標、像素標籤）來追蹤我們網站上的活動，並儲存某些資訊。Cookie 是包含少量數據的文件，可能包含匿名唯一識別碼。這些技術有助於我們記住您的偏好（例如語言設定）、保持您的登入狀態，並收集有關您網站使用模式的統計數據。您可以指示您的瀏覽器拒絕所有 Cookie 或在發送 Cookie 時發出指示。然而，如果您不接受 Cookie，您可能無法使用我們服務的某些部分。

## 2. 資訊的使用

我們收集您的個人資訊主要用於以下目的：

*   **提供和維護我們的服務**：包括管理您的帳戶、提供您所要求的服務和工具（例如雲端筆記、HTML 編輯器），並確保網站的正常運作。
*   **溝通**：回覆您的查詢、提供客戶支援、發送服務相關通知、更新以及重要公告。

## 3. 資訊的分享與揭露

我們不會出售您的個人資訊。我們可能會在以下情況下分享您的資訊：

*   **服務供應商**：我們會與其他商家合作，但我們**不會**提供任何用戶數據。
*   **法律要求**：我們可能會在法律要求或善意相信此類行動對於遵守法律義務、保護和捍衛我們的權利或財產、防止或調查服務相關的不當行為、保護服務使用者或公眾的個人安全或免受法律責任時，揭露您的個人資訊。這包括回應法院命令、政府請求或法律程序。
*   **業務轉讓**：LAN Studio 目前屬於非營利個人工作室，所以不會有被買賣等問題。

## 4. 數據安全

您的個人資訊安全對我們至關重要。我們採取了多種技術和組織措施來保護您的個人資料，防止未經授權的存取、使用、修改和揭露。例如，我們使用 AES-256 加密技術來保護「加密雲端筆記」中的內容。然而，請記住，沒有任何透過網際網路傳輸或電子儲存的方法是100%安全的。儘管我們努力使用商業上可接受的方法來保護您的個人資訊，我們無法保證其絕對安全。

## 5. 您的數據保護權利

根據適用的數據保護法律，您擁有以下權利：

*   **存取權**：您有權要求我們提供您個人資訊的副本。我們將在收到請求後的一個月內回覆您。
*   **更正權**：您有權要求我們更正您認為不準確的任何資訊。您也有權要求我們填寫您認為不完整的資訊。
*   **刪除權**：您有權要求我們在某些條件下刪除您的個人資訊。
*   **限制處理權**：您有權要求我們在某些條件下限制處理您的個人資訊。
*   **反對處理權**：您有權在某些條件下反對我們處理您的個人資訊。
*   **數據可攜權**：您有權要求我們在某些條件下將我們收集的數據轉移給另一個組織，或直接轉移給您。

如果您想行使這些權利，請透過我們的聯絡方式與我們聯繫。我們將在收到請求後的一個月內處理您的請求。

我們的服務可能包含指向非我們營運的其他網站的連結。如果您點擊第三方連結，您將被導向該第三方的網站。我們強烈建議您查看您訪問的每個網站的隱私權政策。我們對任何第三方網站或服務的內容、隱私權政策或實踐不承擔任何責任。
