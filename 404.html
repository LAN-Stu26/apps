<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面不存在 - LAN Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1d1d1d;
            --accent-red: #e74c3c;
            --accent-blue: #ffd966;
            --text-secondary: #bdc3c7;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Noto Sans TC', sans-serif;
            text-align: center;
        }

        .error-wrapper {
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin: 0;
            color: var(--accent-red);
            line-height: 1;
            text-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .error-message {
            font-size: 1.5rem;
            margin: 20px 0 10px 0;
            color: var(--text-secondary);
        }

        /* 倒數計時樣式 */
        .countdown-text {
            font-size: 1.1rem;
            color: #95a5a6;
            margin-bottom: 30px;
        }

        #timer {
            color: var(--accent-blue);
            font-weight: bold;
            font-size: 1.2rem;
            margin: 0 5px;
        }

        .back-home {
            display: inline-block;
            padding: 12px 35px;
            background-color: var(--accent-blue);
            color: #1d1d1d;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .back-home:hover {
            background-color: #ffeb3b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        @media (max-width: 600px) {
            .error-code { font-size: 6rem; }
            .error-message { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="error-wrapper">
        <p class="error-code">404</p>
        <p class="error-message">糟糕！找不到您要尋找的頁面。</p>
        
        <p class="countdown-text">
            系統將在 <span id="timer">5</span> 秒後自動帶您返回首頁
        </p>

        <a href="/home.html" class="back-home">立即返回首頁</a>
    </div>

    <script type="module" src="/navbar.js"></script>

    <script>
        // 設定倒數秒數
        let seconds = 5;
        const countdownElement = document.getElementById('timer');

        const interval = setInterval(() => {
            seconds--;
            
            // 更新畫面上的數字
            if (countdownElement) {
                countdownElement.innerText = seconds;
            }

            // 當秒數歸零
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = '/home.html';
            }
        }, 1000);
    </script>
</body>
</html>
