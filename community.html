<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="LAN Studio 社群平台 - 分享程式碼、發問交流">
    <meta property="og:title" content="LAN Studio Community | 社群平台">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Beta - LAN Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #ffd966;
            --accent-blue: #3498db;
            --bg-color: #1d1d1d;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --border-color: #444;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-color);
            overflow-x: hidden;
        }

        .hero-header {
            position: relative;
            width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--primary-dark);
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            letter-spacing: 3px;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: #cccccc;
            margin-top: 12px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 30px;
        }

        .auth-required {
            text-align: center;
            padding: 40px 20px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 12px;
            margin-bottom: 30px;
            border-left: 4px solid var(--accent-blue);
        }

        .btn-login {
            margin-top: 15px;
            padding: 12px 30px;
            background: var(--primary-dark);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin: 50px 0 35px 0;
            color: var(--primary-dark);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-secondary {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary-dark); color: #000; }
        .btn-secondary { background: transparent; border: 2px solid var(--accent-blue); color: var(--accent-blue); }
        .btn-secondary:hover { background: var(--accent-blue); color: #fff; }

        .posts-container { display: grid; grid-template-columns: 1fr; gap: 25px; margin-bottom: 50px; }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            transition: 0.3s;
        }

        .post-card:hover { border-color: var(--accent-blue); }

        .post-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }

        .post-avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--primary-dark));
            display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold;
        }

        .post-type-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .post-type-badge.question { background: #e74c3c; color: #fff; }
        .post-type-badge.code { background: #27ae60; color: #fff; }

        .post-code-block {
            background: #1a1a1a; padding: 15px; border-radius: 6px; 
            overflow-x: auto; font-family: monospace; font-size: 0.85rem; color: #a8e6cf; margin: 15px 0;
        }

        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color); }

        .post-stats { display: flex; gap: 20px; color: #888; font-size: 0.9rem; }
        .stat-item { cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .stat-item:hover { color: var(--primary-dark); }

        /* 留言區樣式 */
        .comment-section { margin-top: 20px; background: #222; padding: 15px; border-radius: 8px; display: none; }
        .comment-item { padding: 10px 0; border-bottom: 1px solid #333; font-size: 0.9rem; }
        .comment-input-group { display: flex; gap: 10px; margin-top: 10px; }
        .comment-input { flex: 1; padding: 8px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; }

        .form-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; margin-bottom: 40px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--primary-dark); font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; box-sizing: border-box; }

        .file-status { margin-top: 8px; font-size: 0.85rem; color: var(--accent-blue); }
        .hidden { display: none !important; }

        @media (max-width: 850px) { .hero-title { font-size: 2.5rem; } .post-footer { flex-direction: column; gap: 15px; align-items: flex-start; } }
    </style>
</head>
<body>

    <div class="hero-header">
        <div class="hero-title-box">
            <h1 class="hero-title">社群平台</h1>
            <p class="hero-subtitle">交流程式碼與技術問題的專屬空間</p>
        </div>
    </div>

    <div class="container">
        <div id="auth-prompt" class="auth-required" style="display: none;">
            <p>⚠️ 您需要登入才能參與社群互動</p>
            <button class="btn-login" id="auth-prompt-btn">使用 Google 帳號登入</button>
        </div>

        <div id="auth-success" style="display: none;">
            <div class="action-buttons">
                <button class="btn-primary" id="btn-new-question">❓ 發起問題</button>
                <button class="btn-primary" id="btn-share-code">💻 分享程式碼</button>
                <button class="btn-secondary" id="btn-my-posts">📝 我的貼文</button>
            </div>

            <div id="question-form" class="form-container hidden">
                <h3>發起新問題</h3>
                <form id="form-question">
                    <div class="form-group">
                        <label>問題標題 *</label>
                        <input type="text" id="question-title" required>
                    </div>
                    <div class="form-group">
                        <label>問題詳情 *</label>
                        <textarea id="question-content" required></textarea>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn-primary">發布問題</button>
                        <button type="button" class="btn-secondary" id="btn-cancel-question">取消</button>
                    </div>
                </form>
            </div>

            <div id="code-form" class="form-container hidden">
                <h3>分享程式碼</h3>
                <form id="form-code">
                    <div class="form-group">
                        <label>程式碼標題 *</label>
                        <input type="text" id="code-title" required>
                    </div>
                    <div class="form-group">
                        <label>程式碼內容 *</label>
                        <textarea id="code-snippet" style="font-family: monospace;" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>附件上傳 (可選)</label>
                        <input type="file" id="code-file">
                        <div id="upload-status" class="file-status"></div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn-primary" id="submit-code-btn">發布分享</button>
                        <button type="button" class="btn-secondary" id="btn-cancel-code">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <div style="margin: 30px 0; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-secondary" id="filter-all" style="background: var(--accent-blue); color: #fff;">全部</button>
            <button class="btn-secondary" id="filter-questions">❓ 問題</button>
            <button class="btn-secondary" id="filter-code">💻 程式碼</button>
        </div>

        <h2 class="section-title">最新動態</h2>
        <div id="posts-container" class="posts-container"></div>

        <div id="empty-state" class="empty-state" style="display: none; text-align: center; padding: 50px;">
            <p>目前沒有相關貼文 🌱</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjG4P9ZNX2OYOdXw69oFboPoilvAZLG_Q",
            authDomain: "lan-member-studio.firebaseapp.com",
            projectId: "lan-member-studio",
            storageBucket: "lan-member-studio.appspot.com",
            messagingSenderId: "239900590732",
            appId: "1:239900590732:web:f37b953aa04d0cab3a71a9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUser = null;
        let allPosts = [];
        let currentFilter = 'all';

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            document.getElementById('auth-prompt').style.display = user ? 'none' : 'block';
            document.getElementById('auth-success').style.display = user ? 'block' : 'none';
            loadPosts();
        });

        // 監聽資料
        function loadPosts() {
            const q = query(collection(db, 'community_posts'), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                allPosts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderPosts();
            });
        }

        // 渲染貼文
        function renderPosts() {
            const container = document.getElementById('posts-container');
            let filtered = allPosts;
            if (currentFilter === 'questions') filtered = allPosts.filter(p => p.type === 'question');
            else if (currentFilter === 'code') filtered = allPosts.filter(p => p.type === 'code');
            else if (currentFilter === 'mine') filtered = allPosts.filter(p => p.authorEmail === currentUser?.email);

            container.innerHTML = filtered.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <div style="display:flex; gap:12px; align-items:center;">
                            <div class="post-avatar">${post.author[0]}</div>
                            <div>
                                <strong>${escapeHtml(post.author)}</strong>
                                <div style="font-size:0.75rem; color:#888;">${post.createdAt?.toDate().toLocaleString() || ''}</div>
                            </div>
                        </div>
                        <div class="post-type-badge ${post.type}">${post.type === 'question' ? '❓ 問題' : '💻 程式碼'}</div>
                    </div>
                    <h3>${escapeHtml(post.title)}</h3>
                    <p>${escapeHtml(post.content || post.description || '')}</p>
                    ${post.codeSnippet ? `<div class="post-code-block"><code>${escapeHtml(post.codeSnippet)}</code></div>` : ''}
                    ${post.fileUrl ? `<div style="margin:10px 0;"><a href="${post.fileUrl}" target="_blank" style="color:var(--accent-blue); text-decoration:none;">📎 查看附件檔案</a></div>` : ''}
                    
                    <div class="post-footer">
                        <div class="post-stats">
                            <div class="stat-item" onclick="handleLike('${post.id}')">❤️ ${post.likes || 0}</div>
                            <div class="stat-item" onclick="toggleComments('${post.id}')">💬 ${post.comments?.length || 0} 回應</div>
                        </div>
                    </div>

                    <div id="comments-${post.id}" class="comment-section">
                        <div id="list-${post.id}">
                            ${(post.comments || []).map(c => `<div class="comment-item"><strong>${escapeHtml(c.user)}:</strong> ${escapeHtml(c.text)}</div>`).join('')}
                        </div>
                        <div class="comment-input-group">
                            <input type="text" id="input-${post.id}" class="comment-input" placeholder="寫下你的回應...">
                            <button class="btn-primary" style="padding:5px 15px;" onclick="addComment('${post.id}')">發送</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 功能函數
        window.handleLike = async (id) => {
            if (!currentUser) return alert('請先登入');
            await updateDoc(doc(db, 'community_posts', id), { likes: increment(1) });
        };

        window.toggleComments = (id) => {
            const el = document.getElementById(`comments-${id}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        };

        window.addComment = async (id) => {
            const input = document.getElementById(`input-${id}`);
            if (!input.value || !currentUser) return;
            await updateDoc(doc(db, 'community_posts', id), {
                comments: arrayUnion({ user: currentUser.displayName || '使用者', text: input.value, createdAt: new Date() })
            });
            input.value = '';
        };

        // 發文與檔案處理
        const handleFileUpload = async (file) => {
            if (!file) return null;
            const fileRef = ref(storage, `community/${Date.now()}_${file.name}`);
            const snapshot = await uploadBytes(fileRef, file);
            return await getDownloadURL(snapshot.ref);
        };

        document.getElementById('form-code').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-code-btn');
            const status = document.getElementById('upload-status');
            btn.disabled = true;
            status.innerText = "正在上傳檔案與發布...";

            const fileUrl = await handleFileUpload(document.getElementById('code-file').files[0]);
            
            await addDoc(collection(db, 'community_posts'), {
                type: 'code',
                title: document.getElementById('code-title').value,
                codeSnippet: document.getElementById('code-snippet').value,
                fileUrl: fileUrl,
                author: currentUser.displayName,
                authorEmail: currentUser.email,
                createdAt: new Date(),
                likes: 0,
                comments: []
            });
            
            btn.disabled = false;
            status.innerText = "";
            resetForms();
        };

        document.getElementById('form-question').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, 'community_posts'), {
                type: 'question',
                title: document.getElementById('question-title').value,
                content: document.getElementById('question-content').value,
                author: currentUser.displayName,
                authorEmail: currentUser.email,
                createdAt: new Date(),
                likes: 0,
                comments: []
            });
            resetForms();
        };

        // UI 控制
        const resetForms = () => {
            document.querySelectorAll('.form-container').forEach(f => f.classList.add('hidden'));
            document.querySelectorAll('form').forEach(f => f.reset());
        };

        document.getElementById('btn-new-question').onclick = () => { resetForms(); document.getElementById('question-form').classList.remove('hidden'); };
        document.getElementById('btn-share-code').onclick = () => { resetForms(); document.getElementById('code-form').classList.remove('hidden'); };
        document.getElementById('btn-cancel-question').onclick = resetForms;
        document.getElementById('btn-cancel-code').onclick = resetForms;
        document.getElementById('auth-prompt-btn').onclick = () => window.loginWithGoogle?.();

        document.getElementById('filter-all').onclick = () => { currentFilter = 'all'; renderPosts(); };
        document.getElementById('filter-questions').onclick = () => { currentFilter = 'questions'; renderPosts(); };
        document.getElementById('filter-code').onclick = () => { currentFilter = 'code'; renderPosts(); };
        document.getElementById('btn-my-posts').onclick = () => { currentFilter = 'mine'; renderPosts(); };

        function escapeHtml(text) { return text ? text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : ''; }
    </script>
    <script src="navbar.js" type="module"></script>
</body>
</html>
