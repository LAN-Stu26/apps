<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在前往 /apps.html - LAN Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1d1d1d;
            --accent-blue: #ffd966;
            --text-secondary: #bdc3c7;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            flex-direction: column;
        }

        #navbar-container {
            width: 100%;
            z-index: 1000;
        }

        .redirect-wrapper {
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .loading-icon {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 217, 102, 0.2);
            border-top: 5px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
            color: #ffffff;
        }

        .sub-message {
            font-size: 1.1rem;
            margin-top: 15px;
            color: var(--text-secondary);
        }

        .manual-link {
            margin-top: 30px;
            color: var(--accent-blue);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-blue);
            padding-bottom: 2px;
            transition: opacity 0.3s;
        }

        .manual-link:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .message { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="redirect-wrapper">
        <div class="loading-icon"></div>
        <p class="message">正在前往 /apps.html</p>
        <p class="sub-message">請稍候，系統正在為您跳轉...</p>
        
        <a href="/apps.html" class="manual-link">若沒有自動跳轉，請點擊此處</a>
    </div>

    <script type="module" src="/navbar.js"></script>

    <script>
        // 頁面載入後立即執行跳轉
        window.location.href = '/apps.html';
    </script>
</body>
</html>
